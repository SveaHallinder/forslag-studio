<!doctype html><html lang="sv"><meta charset="utf-8"><title>Branding regression tests</title><h1>Branding regression tests</h1><pre id="results"></pre><script type="module">
let extractBrand;try{({extractBrand}=await import('/brand-content.mjs'));}catch{extractBrand=()=>({accent:'',warnings:[]});}
const results=[];const test=(name,fn)=>{try{fn();results.push('PASS '+name);}catch(error){results.push('FAIL '+name+': '+error.message);}};
const assert=(value,message)=>{if(!value)throw new Error(message);};
function extract(css,html='<main><h1>Heading</h1><p>Body</p><a class="cta">Contact</a></main>',url='https://example.com/css/main.css'){const doc=new DOMParser().parseFromString(html,'text/html');return extractBrand(doc,[{css,url}],{heading:doc.querySelector('h1'),button:doc.querySelector('.cta')});}
test('Matched font families and relative variable font URLs',()=>{const b=extract('@font-face{font-family:"Source Display";src:url(../fonts/display.woff2) format("woff2");font-weight:100 900}body{font-family:"Source Text",sans-serif}h1{font-family:"Source Display",serif}');assert(b.typography?.heading==='Source Display','heading family');assert(b.typography?.body==='Source Text','body family');assert(b.typography.faces[0]?.url==='https://example.com/fonts/display.woff2','relative font URL');assert(b.typography.faces[0]?.weight==='100 900','variable weight');});
test('Scoped variables and specificity preserve actual CTA branding',()=>{const b=extract(':root{--brand:#dd7700}.unrelated{--brand:#ff0000}.hero{--brand:rgb(20, 80, 140);--font:"Scoped Font"}h1{font-family:var(--font)}.cta{background:var(--brand)}#primary{background:#267b50}', '<main class="hero"><h1>Title</h1><p>Body</p><a id="primary" class="cta">Call</a></main>');assert(b.accent==='#267b50','specific CTA color');assert(b.typography?.heading==='Scoped Font','inherited scoped variable');});
test('Inline and shorthand fonts supported',()=>{const b=extract('body{font:400 16px/1.6 "Body Copy",sans-serif}h1{font:700 40px/1.1 "Display Copy",serif}.cta{background-color:#285970}', '<main><h1 style="font-family:Inline Display">Title</h1><p>Body</p><a class="cta" style="background-color:hsl(120,50%,30%)">Call</a></main>');assert(b.typography?.heading==='Inline Display','inline heading font');assert(b.typography?.body==='Body Copy','shorthand body');assert(b.accent==='#267326','HSL color');});
test('Responsive conflicts are reported instead of guessed',()=>{const b=extract('h1{font-family:Desktop}.cta{background:#248f60}@media(max-width:700px){h1{font-family:Mobile}.cta{background:#945020}}');assert(!b.typography?.heading,'conflicting family omitted');assert(!b.accent,'conflicting CTA omitted');assert(b.warnings.length>0,'uncertainty warning');});
test('Unrelated brand variables and neutral theme color are not branding',()=>{const b=extract('.widget{--brand:#ff0000}:root{--primary:#ffffff}');assert(!b.accent,'no guessed accent');});
test('Unicode subsets retained and unsafe font URLs rejected',()=>{const b=extract('@font-face{font-family:Display;src:url(https://fonts.example/latin.woff2);unicode-range:U+0000-00FF}@font-face{font-family:Display;src:url(https://fonts.example/latin-ext.woff2);unicode-range:U+0100-024F}@font-face{font-family:Display;src:url(javascript:alert);font-weight:800}h1{font-family:Display}');assert(b.typography.faces.length===2,'two safe subset faces');assert(b.typography.faces[1].unicodeRange==='U+100-24F'||b.typography.faces[1].unicodeRange==='U+0100-024F','range preserved');});
test('Important declarations and inherited variables',()=>{const b=extract(':root{--brand:25 70 130}body{--heading:Actual}h1{font-family:var(--heading)!important}.hero h1{font-family:Wrong}.cta{background:rgb(var(--brand))}');assert(b.typography.heading==='Actual','important family');assert(b.accent==='#194682','space RGB channels');});
test('Heading text spans inherit their own resolved family',()=>{const b=extract('body{font-family:Body}h1 span{font-family:Display}', '<main><h1><span>Actual title</span></h1><p>Body</p></main>');assert(b.typography?.heading==='Display','visible heading span family');});
test('Variable font shorthand resolves before selecting family',()=>{const b=extract(':root{--heading:700 40px/1.2 "Source Display",serif}h1{font:var(--heading)}');assert(b.typography?.heading==='Source Display','font shorthand variable');});
test('Functional selector specificity matches actual heading rule',()=>{const b=extract('.title{font-family:Actual}:is(h1,h2){font-family:Wrong}', '<h1 class="title">Heading</h1>');assert(b.typography?.heading==='Actual','is() type must not beat class');});
test('Next.js family hashes and global dark conflicts',()=>{const b=extract('@font-face{font-family:__Source_ab123;src:url(/next/font.woff2)}body{font-family:__Source_ab123,__Source_Fallback_ab123,sans-serif}:root{--primary:#226699}@media(prefers-color-scheme:dark){:root{--primary:#aa6600}}');assert(b.typography?.body==='__Source_ab123','actual first font family');assert(b.typography.faces.length===1,'matching Next.js face');assert(!b.accent,'ambiguous dark mode global brand');});
test('Unlayered font declarations take precedence over later layered rules',()=>{const b=extract('h1{font-family:Actual}@layer base{h1{font-family:Wrong}}');assert(b.typography?.heading==='Actual','unlayered cascade precedence');});
test('Later page stylesheet overrides inherited app font with source variable',()=>{const doc=new DOMParser().parseFromString('<body class="source-fonts"><main><section class="wl-hero"><h1>Write your story</h1><p>Body copy</p></section></main></body>','text/html');const b=extractBrand(doc,[{css:'.source-fonts{--font-inter:Inter;--font-montserrat-alternates:"Montserrat Alternates","Montserrat Alternates Fallback"}body{font-family:var(--font-inter)}',url:'https://example.com/fonts.css'},...Array.from({length:4},()=>({css:'.unrelated{color:red}',url:'https://example.com/chunk.css'})),{css:'.wl-hero h1{font-family:var(--font-montserrat-alternates),sans-serif}',url:'https://example.com/page.css'}],{heading:doc.querySelector('h1')});assert(b.typography.heading==='Montserrat Alternates','late hero font');assert(b.typography.body==='Inter','body font');});
test('Both families retain later Latin font subsets within bounded cap',()=>{const css=Array.from({length:27},(_,i)=>'@font-face{font-family:Display;src:url(/font-'+i+'.woff2);font-weight:'+(i===26?'700':'400')+';unicode-range:U+'+(i===26?'0000-00FF':'0'+(400+i).toString(16))+'}').join('')+'h1{font-family:Display}';const b=extract(css);assert(b.typography.faces.length===27,'all27 safe font subsets kept');assert(b.typography.faces.at(-1).url.endsWith('/font-26.woff2'),'later Latin bold retained');});
test('Transparent CTA text corroborates a global brand color',()=>{const b=extract(':root{--primary:#24182f;--accent:#eee7fa}body{color:var(--primary)}.cta{background:transparent}');assert(b.accent==='#24182f','corroborated primary color');});
test('Neutral body, surface and header colors keep their semantic roles',()=>{const b=extract(':root{--secondary:#523575}body{background:#faf8f3;color:#202020}header{background:#141414;color:white}main p{color:#555555}section{background:#eeeeee}.cta{background:#151515}', '<header><a href="/">Logo</a></header><main><h1>Heading</h1><p>Copy</p><a class="cta">Contact</a><section><h2>Services</h2><p>Text</p></section></main>');assert(b.branding?.background==='#faf8f3','body background');assert(b.branding?.text==='#202020','body text');assert(b.branding?.mutedText==='#555555','paragraph color');assert(b.branding?.headerBackground==='#141414','header background');assert(b.branding?.headerText==='#ffffff','header text');assert(b.branding?.surface==='#eeeeee','surface');assert(b.branding?.secondary==='#523575','secondary');assert(b.accent==='#151515','neutral primary CTA');});
test('Transparent header uses actual ancestor background but conflicts are omitted',()=>{const b=extract('body{background:#fafafa;color:#222222}header{background:transparent}@media(max-width:700px){body{background:#141414}}');assert(!b.branding?.background,'responsive background omitted');assert(!b.branding?.headerBackground,'uncertain header background omitted');});
test('Gradient backgrounds are not reduced to a guessed brand color',()=>{const b=extract('body{background:linear-gradient(red,blue);color:#222222}');assert(!b.branding?.background,'gradient omitted');});
document.querySelector('#results').textContent=results.join('\n')+'\n'+results.filter(x=>x.startsWith('PASS')).length+' PASS, '+results.filter(x=>x.startsWith('FAIL')).length+' FAIL';
</script></html>
