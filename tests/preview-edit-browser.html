<!doctype html><meta charset="utf-8"><title>Preview editing regression</title><pre id="results">Running…</pre><div id="fixture"></div>
<script type="module">
const output=document.querySelector('#results'),fixture=document.querySelector('#fixture');let passed=0,failures=[];
const test=(name,run)=>{try{run();passed++;}catch(error){failures.push(name+': '+error.message);}};
const assert=(value,message)=>{if(!value)throw new Error(message);};
try{
 const {installPreviewEditing}=await import('/preview-edit.mjs');
 fixture.innerHTML='<header class="nav"><a class="brand" href="#">Logo</a><nav class="nav-links"><a href="https://example.com">Menu</a></nav></header><section class="hero-copy"><h1>Original heading</h1><p>Original copy</p><a class="button" href="https://example.com">Book</a></section><div class="visual"><img src="data:image/png;base64,"></div><div class="cards"><article class="card"><img src="data:image/png;base64,"><div class="card-meta"><h2>Service</h2><blockquote>Copy</blockquote></div></article></div><section class="contact"><div class="contact-links">Contact</div></section>';
 let selection;const original=fixture.innerHTML,dispose=installPreviewEditing(document,{onSelect:target=>selection=target,cardIndexes:[1]});
 test('heading opens exact text target with original content intact',()=>{fixture.querySelector('h1').click();assert(selection.field==='headline','Wrong field');assert(fixture.querySelector('h1').textContent==='Original heading','Text changed');});
 test('keyboard edits image and prevents page scrolling',()=>{const image=fixture.querySelector('.card img'),event=new KeyboardEvent('keydown',{key:' ',bubbles:true,cancelable:true});image.dispatchEvent(event);assert(selection.type==='image'&&selection.scope==='1','Wrong image');assert(event.defaultPrevented,'Space not prevented');});
 test('menu navigation is prevented while editing',()=>{const event=new MouseEvent('click',{bubbles:true,cancelable:true});fixture.querySelector('.nav-links a').dispatchEvent(event);assert(event.defaultPrevented&&selection.type==='navigation','Navigation not intercepted');});
 test('testimonial copy selects original card index',()=>{fixture.querySelector('blockquote').click();assert(selection.type==='card'&&selection.index===1&&selection.field==='description','Wrong testimonial target');});
 test('dispose restores semantics and clears decorations',()=>{dispose();assert(!fixture.querySelector('[data-studio-edit]'),'Decoration remains');assert(fixture.innerHTML===original,'Original attributes changed');});
}catch(error){failures.push(error.message);}
output.textContent=JSON.stringify({passed,failures},null,2);document.title=failures.length?'FAIL preview edit':'PASS preview edit';
</script>
