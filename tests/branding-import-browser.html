<!doctype html><html lang="sv"><meta charset="utf-8"><title>Riktiga importkontroller</title><style>body{font:15px system-ui;margin:24px}button,select{font:inherit;padding:12px}pre{white-space:pre-wrap;max-height:180px;overflow:auto}iframe{width:1100px;height:850px;border:1px solid #ddd;display:block;margin-top:20px}</style><h1>Riktiga importkontroller</h1><p>Hämtar offentliga företagssidor. Sparar inga projekt.</p><button id="start">Testa tre företag</button><select id="company" aria-label="Visa företag"></select><pre id="results">Redo</pre><iframe id="preview" title="Importerad startsida"></iframe><script type="module">
import {browserAPI} from '/browser-api.mjs';import {renderDemo} from '/render.mjs';
const sources=['https://www.verkli.com/waitlist','https://vegavista.se/','https://hallinc.se/'],projects=[],results=[],output=document.querySelector('#results'),select=document.querySelector('#company'),frame=document.querySelector('iframe');
select.onchange=()=>{frame.srcdoc=renderDemo(projects[Number(select.value)]);};
async function runImports(){document.querySelector('#start').disabled=true;for(const url of sources){output.textContent=results.join('\n\n')+'\nHämtar '+url;try{const response=await browserAPI('/api/import',{url,includePages:false}),p=await response.json();if(!response.ok)throw new Error(p.error);projects.push(p);const option=new Option(p.name,String(projects.length-1));select.add(option);select.value=String(projects.length-1);select.onchange();results.push(JSON.stringify({source:p.source,name:p.name,logo:p.logo,branding:p.branding,fonts:p.typography?{heading:p.typography.heading,body:p.typography.body}:null,cards:p.cards.length,warnings:p.warnings},null,2));}catch(e){results.push('FAIL '+url+' '+e.message);}}output.textContent=results.join('\n\n')+'\nKLART';if(projects.length){select.value='0';select.onchange();}document.querySelector('#start').disabled=false;}
document.querySelector('#start').onclick=runImports;
runImports();
</script></html>
