<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visuell kvalitetskontroll · QA</title><link rel="stylesheet" href="/studio.css"><style>body{padding:24px}pre{white-space:pre-wrap}iframe{border:0}</style></head><body><h1>Visuell kvalitetskontroll</h1><button id="run" class="button primary">Testa alla fem delar</button><pre id="result" role="status">Isolerade exempel. Inga kundprojekt ändras.</pre><script type="module">
import {checkVisualLayout} from '/visual-checks.mjs';import {templates} from '/templates.mjs';import {renderDemo} from '/render.mjs';import {recommendDirections} from '/design-directions.mjs';import {renderTemplateThumbnail} from '/design-workbench.mjs';import {planCopyRefinements,applyCopyRefinements,planActionRefinements,applyActionRefinements} from '/proposal-refinements.mjs';import {probeLaunchImage} from '/browser-api.mjs';import {checkLaunchAssets} from '/launch-checks.mjs';
const $=id=>document.getElementById(id),image='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800"><rect width="1200" height="800" fill="#476350"/><circle cx="600" cy="400" r="160" fill="#e4d8b9"/></svg>');
const base={name:'Nord Café',headline:'Kaffe och en stund för dig.',description:'Hos oss finns plats för en kaffe och en lugn stund tillsammans.\n\nMENY\nEspresso 35 kr\nLatte 45 kr\n\nÖPPETTIDER\nMåndag–fredag 08–17',hero:image,email:'qa@example.com',cta:'Läs mer',ctaHref:'mailto:qa@example.com',accent:'#476350',importedAt:'QA',cards:[{title:'Vårt café',description:'Originalets egna ord.',image}]};
$('run').onclick=async()=>{let count=0;const failures=[],check=(ok,label)=>{count++;if(!ok)failures.push(label);};$('run').disabled=true;
try{
 const before=JSON.stringify(base),copy=applyCopyRefinements(base,planCopyRefinements(base)),next=applyActionRefinements(copy,planActionRefinements(copy));check(next.cards[0].title==='MENY'&&next.cards[1].title==='ÖPPETTIDER','branschsektioner från underlag');check(next.cta==='Skicka ett mejl'&&next.ctaHref===base.ctaHref,'konkret kontaktknapp');check(JSON.stringify(base)===before,'underlaget oförändrat');
 for(const {id}of templates){const result=await checkVisualLayout({...next,templateId:id});check(result.checked===2,id+' två faktiska layoutvyer');check(!result.checks.some(c=>!c.ok),id+' layout: '+result.checks.filter(c=>!c.ok).map(c=>c.help).join(' / '));$('result').textContent=count+' kontroller… '+id;}
 const overflow=await checkVisualLayout({...base,templateId:'precision'},{widths:[320],render:p=>renderDemo(p).replace('</head>','<style>.hero-copy h1{width:900px!important;min-width:900px!important;white-space:nowrap!important}</style></head>')});check(overflow.checks.some(c=>!c.ok&&c.blocking),'för bred mobilvy upptäcks');
 const stopped=new AbortController();stopped.abort();const aborted=await checkVisualLayout(base,{signal:stopped.signal});check(aborted.checked===0&&aborted.checks.every(c=>!c.ok),'avbruten kontroll blir aldrig godkänd');
 const subpages=await checkVisualLayout({...next,templateId:'norriva',source:'https://example.com/',pages:[{name:'Om oss',source:'https://example.com/about',headline:'Företagets egna ord',description:'Ett möte med människorna bakom caféet.',cards:[]}]});check(subpages.checked===4&&!subpages.checks.some(c=>!c.ok),'undersidor kontrolleras med gemensam branding');
 for(const name of ['Nord Café','Klar Advokatbyrå','Hotell Utsikten','Norriva förpackningar']){
  const p={...base,name,description:'Företagets egna uppgifter.',typography:{heading:'Georgia',body:'Verdana'}},shapes=new Set(),fonts=new Set();
  for(const direction of recommendDirections(p)){
   const frame=document.createElement('iframe');frame.style.cssText='position:fixed;left:-100000px;width:1280px;height:900px';document.body.append(frame);await new Promise(resolve=>{frame.onload=resolve;frame.srcdoc=renderTemplateThumbnail(p,p,direction.templateId,true).replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi,'');});const d=frame.contentDocument;await d.fonts.ready;const w=frame.contentWindow,h=d.querySelector('h1'),hero=d.querySelector('.hero-layout'),visual=d.querySelector('.visual');fonts.add(w.getComputedStyle(h).fontFamily);shapes.add(JSON.stringify([w.getComputedStyle(hero).gridTemplateColumns,Math.round(h.getBoundingClientRect().width),Math.round(visual?.getBoundingClientRect().height||0)]));frame.remove();
  }
  check(shapes.size===3,name+' tre olika kompositioner');check(fonts.size>=2,name+' olika typsnittsuttryck');check(p.typography.heading==='Georgia',name+' originaltypsnitt kvar');
 }
 const canvas=document.createElement('canvas');canvas.width=1200;canvas.height=800;const ctx=canvas.getContext('2d'),gradient=ctx.createLinearGradient(0,0,1200,0);gradient.addColorStop(0,'#111');gradient.addColorStop(1,'#eee');ctx.fillStyle=gradient;ctx.fillRect(0,0,1200,800);const soft=canvas.toDataURL('image/jpeg');const detail=await probeLaunchImage(soft);check(detail.soft===true&&detail.width===1200,'mjuk detaljskärpa mäts från avkodad foto: '+JSON.stringify(detail));const assets=await checkLaunchAssets({hero:soft},async()=>detail);check(assets.checks.some(c=>!c.ok&&!c.blocking&&c.help.includes('uppskattning')),'möjlig oskärpa blir försiktig påminnelse');
 $('result').textContent=failures.length?'FAIL '+failures.length+' av '+count+'\n'+failures.join('\n'):'PASS '+count+' kontroller · 18 designer · mobil/desktop · undersidor · branschtext · knappar · variation · oskärpeindikering';document.title=failures.length?'FAIL quality':'PASS quality';
}catch(error){$('result').textContent='FAIL '+error.message;document.title='FAIL quality';}finally{$('run').disabled=false;}
};
</script></body></html>
