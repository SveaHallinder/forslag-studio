<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Förfining · QA</title><link rel="stylesheet" href="/studio.css"><link rel="stylesheet" href="/design-workbench.css"><style>body{padding:24px;background:#f6f7f8}header{display:flex;flex-wrap:wrap;gap:12px}pre{white-space:pre-wrap}#preview{border:0;width:100%;height:700px;background:white}</style></head><body><header><button class="button primary" id="review">Förfina hela sidan</button><button class="button secondary" id="run">Testa förfiningen</button><button class="button secondary" id="reset">Återställ exempel</button></header><pre id="result" role="status">Illustrativt café. Inga sparade projekt eller utkast ändras.</pre><iframe id="preview" title="Illustrativ kundsida"></iframe><script type="module">
import {renderDemo,normalizeProject} from '/render.mjs';import {createWholePageQuality} from '/whole-page-quality.mjs';import {templates} from '/templates.mjs';
const image=(width,height)=>{const c=document.createElement('canvas');c.width=width;c.height=height;const ctx=c.getContext('2d');ctx.fillStyle='#8b674e';ctx.fillRect(0,0,width,height);ctx.fillStyle='#eee5d8';ctx.beginPath();ctx.arc(width/2,height/2,height/3,0,Math.PI*2);ctx.fill();return c.toDataURL();},small=image(320,240),large=image(1280,960);
const copy='Hos Café Nord finns plats för både en snabb espresso på väg till jobbet och långa samtal över nybakat bröd. '+('Espresso kostar 35 kr. Vi berättar gärna mer om kaffet och brödet som serveras hos oss. ').repeat(9);
const base=normalizeProject({name:'Café Nord · exempel',templateId:'norriva',headline:'En stund för dig.',description:copy,hero:small,heroGallery:[{url:small},{url:large}],email:'qa@example.com',accent:'#547060',importedAt:'QA',cards:[{title:'Kaffet',description:'Företagets faktiska beskrivning.'}],original:{headline:'Original',description:copy}});
let project=structuredClone(base);const $=id=>document.getElementById(id),out=$('result');
function refresh(){ $('preview').srcdoc=renderDemo(project).replace('<body ','<body data-motion="static" '); }
const quality=createWholePageQuality({getProject:()=>project,probe:async url=>({width:url===small?320:1280,height:url===small?240:960}),changed:next=>{project=next;refresh();},edit:target=>{out.textContent='Redigera '+target.field;},notify:()=>{}});
$('review').onclick=()=>quality.open();$('reset').onclick=()=>{project=structuredClone(base);refresh();out.textContent='Exempel återställt.';};refresh();
const ready=()=>new Promise((resolve,reject)=>{const start=performance.now();const tick=()=>{if($('wholePageDialog').getAttribute('aria-busy')==='false')resolve();else if(performance.now()-start>5000)reject(new Error('Genomgången blev inte klar.'));else requestAnimationFrame(tick);};tick();});
$('run').onclick=async()=>{let checks=0;const failures=[],check=(ok,label)=>{checks++;if(!ok)failures.push(label);},open=async()=>{quality.open();await ready();},close=()=>document.querySelector('#wholePageDialog .dialog-close').click(),original=JSON.stringify(base);$('run').disabled=true;
try{
 project=structuredClone(base);await open();check(!$('wholePageCopyOption').checked,'textändringen kräver opt-in');check($('wholePageCopy').textContent.includes('35 kr'),'originaltexten går att granska');check($('wholePageIssues').textContent.includes('meny'),'caféråd');close();check(JSON.stringify(project)===original,'avbryt behåller innehållet');
 await open();$('wholePageCopyOption').click();$('wholePageApply').click();check(project.hero===large,'bildbytet används');check(project.description.length<=320,'kort introduktion');check(project.cards.length===base.cards.length+1,'fördjupningssektion tillagd');check(project.cards[1].title===base.cards[0].title,'befintliga sektioner kvar');check((project.description+' '+project.cards[0].description).replace(/\s+/g,' ').trim()===copy.trim(),'alla originalord kvar');check(project.email===base.email&&project.accent===base.accent,'kontakt och varumärke kvar');check(JSON.stringify(project.original)===JSON.stringify(base.original),'originalkopia kvar');
 $('wholePageUndo').click();await ready();check(JSON.stringify(project)===original,'ångra återställer bild och text');close();
 await open();$('wholePageImagesOption').click();$('wholePageCopyOption').click();$('wholePageApply').click();check(project.hero===small&&project.description.length<320,'textval ändrar inte bilden');close();
 project=structuredClone(base);await open();$('wholePageApply').click();check(project.hero===large&&project.description===base.description,'bildval ändrar inte texten');project.headline='Senaste redigeringen';$('wholePageUndo').click();check(project.headline==='Senaste redigeringen'&&$('wholePageStatus').textContent.includes('bevara'),'ångra skyddar senaste redigering');close();
 project=structuredClone(base);await open();$('wholePageCopyOption').click();project={...project,headline:'Ändrat under granskning'};$('wholePageApply').click();check(project.hero===small&&project.description===base.description&&$('wholePageStatus').textContent.includes('ändrades'),'gammal plan nekas');close();
 project=structuredClone(base);await open();$('wholePageCopyOption').click();$('wholePageApply').click();close();
 for(const {id}of templates)for(const width of [320,1280]){
  const frame=document.createElement('iframe');frame.style.cssText='position:absolute;left:-10000px;width:'+width+'px;height:850px';document.body.append(frame);await new Promise(resolve=>{frame.onload=resolve;frame.srcdoc=renderDemo({...project,templateId:id}).replace('<body ','<body data-motion="static" ');});const d=frame.contentDocument;await d.fonts.ready;check(d.documentElement.scrollWidth<=width+1,id+'/'+width+' ryms');check(d.body.textContent.includes('35 kr')&&d.body.textContent.includes(base.cards[0].description),id+'/'+width+' bevarad text');check(!!d.querySelector('a[href="mailto:qa@example.com"]'),id+'/'+width+' fungerande destination');frame.remove();
 }
 out.textContent=failures.length?'FAIL\n'+failures.join('\n'):'PASS '+checks+' kontroller · '+templates.length+' designer · 320/1280 · opt-in, avbryt, bild/text, ångra och gamla planer';document.title=failures.length?'FAIL refinements':'PASS refinements';
}catch(error){out.textContent='FAIL '+error.message;document.title='FAIL refinements';}finally{$('run').disabled=false;refresh();}
};
</script></body></html>
