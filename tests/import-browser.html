<!doctype html><html lang="sv"><meta charset="utf-8"><title>Importtester</title><body><h1>Importtester med riktig DOM</h1><pre id="results">Kör…</pre><script type="module">
import {extractContent} from '/import-content.mjs';
const outcomes=[];
const check=(name,fn)=>{try{fn();outcomes.push('PASS '+name);}catch(e){outcomes.push('FAIL '+name+': '+e.message);}};
const assert=(ok,msg)=>{if(!ok)throw Error(msg);};
const html=`<html><head><title>Acme | Startsida</title><meta name="description" content="SEO-text som inte ska ersätta sidans introduktion"><style>:root{--brand-primary:#b63552}</style></head><body><header><a href="/"><img src="/acme.svg" alt="Acme" width="100"></a><nav><a href="/#repair">Reparation</a><a href="/team">Vårt team</a></nav></header><main><section id="intro"><div><h1>Vi lagar det du älskar</h1><p>Originalets riktiga introduktion.</p><a href="/book">Boka reparation</a></div><img src="/hero.jpg" width="1600" height="1000"></section><section id="repair"><article><img src="/repair.jpg" width="600" height="400"><div><h2>Reparation</h2><p>Första stycket.</p><p>Andra stycket.</p><ul><li>Med garanti</li><li>På plats</li></ul></div></article><article><h2>Service</h2><p>Service har ingen bild.</p></article></section><aside hidden><h2>Dold mobilkopia</h2></aside><div id="cookie-banner"><h2>Vi använder cookies</h2><p>Godkänn kakor.</p></div></main><footer><img src="/partner.jpg" width="900" height="600"><a href="mailto:info@acme.example">Mejla oss</a></footer></body></html>`;
const media=extractContent('<main><section><h1>En lugn vistelse</h1><p>Originalets introduktion.</p><div><video poster="/spa.jpg"><source src="/spa.mp4">Your browser does not support the video tag.<p>Video fallback</p></video></div></section></main>','https://example.com/');
check('video fallback is excluded while its poster and real copy remain',()=>assert(media.description==='Originalets introduktion.'&&media.hero==='https://example.com/spa.jpg',JSON.stringify(media)));
check('certifieringsbilder blir inte hero men kan fortfarande väljas under Bilder',()=>{const p=extractContent('<main><h1>Juridisk rådgivning</h1><p>Originalets introduktion.</p><img src="/standard.png" alt="SIS Standard Developer 2026" width="900" height="600"><section><h2>Certifiering</h2><img src="/iso-certificate.jpg" alt="ISO 9001 certificate" width="900" height="600"></section></main>','https://example.com/');assert(!p.hero&&!p.heroGallery?.length&&p.images.some(i=>i.url==='https://example.com/standard.png')&&p.cards[0].image==='https://example.com/iso-certificate.jpg',JSON.stringify(p));});
const p=extractContent(html,'https://acme.example/');
check('synlig copy före metadata',()=>assert(p.description==='Originalets riktiga introduktion.',p.description));
check('meny bevaras',()=>assert(p.navigation?.[0].label==='Reparation'&&p.navigation[1].label==='Vårt team','meny saknas'));
check('hero och logotyp separeras',()=>assert(p.hero==='https://acme.example/hero.jpg'&&p.logo==='https://acme.example/acme.svg','fel hero eller logo'));
check('sektion behåller stycken och lista',()=>assert(p.cards.find(c=>c.title==='Reparation')?.description==='Första stycket.\n\nAndra stycket.\n\nMed garanti\n\nPå plats',JSON.stringify(p.cards)));
check('rätt bild inom sektion',()=>assert(p.cards.find(c=>c.title==='Reparation')?.image==='https://acme.example/repair.jpg'&&!p.cards.find(c=>c.title==='Service')?.image,'bild kopplad till fel text'));
check('dolt innehåll och kakdialog bort',()=>assert(!p.cards.some(c=>/Dold|cookies/.test(c.title)),'skräpinnehåll'));
check('originalets CTA',()=>assert(p.cta==='Boka reparation'&&p.ctaHref==='https://acme.example/book','CTA saknas'));
check('uttrycklig brandfärg',()=>assert(p.accent==='#b63552',p.accent));
const flat=extractContent('<main><h1>Hero</h1><p>Intro.</p><img src="/hero.jpg"><h2>Service</h2><p>Rätt text.</p><img src="/service.jpg"><h2>Annat</h2><p>Ingen bild.</p></main>','https://example.com/');
check('platt HTML blandar inte sektioner',()=>assert(flat.description==='Intro.'&&flat.cards[0].description==='Rätt text.'&&flat.cards[0].image==='https://example.com/service.jpg'&&!flat.cards[1].image,JSON.stringify(flat.cards)));
const semantic=extractContent('<header><nav><a href="/team">Team</a></nav></header><main><section><header><h2>Första synliga rubriken</h2></header><p>Intro.</p></section><section><h1>Senare rubrik</h1><p>Senare text.</p></section></main><footer><nav><a href="/privacy">Privacy</a></nav></footer>','https://example.com/');
check('sektionens header och visuell ordning bevaras',()=>assert(semantic.headline==='Första synliga rubriken',semantic.headline));
check('footer blir inte huvudmeny',()=>assert(semantic.navigation.length===1&&semantic.navigation[0].label==='Team',JSON.stringify(semantic.navigation)));
const contact=extractContent('<h1>Kontakt</h1><a href="tel:+46%2070%20123%204567">Ring</a><a href="mailto:info%40example.com">Mail</a>','https://example.com/');
check('kodade kontaktlänkar behålls',()=>assert(contact.phone==='+46 70 123 4567'&&contact.email==='info@example.com','kontakt tappades'));
check('tom JavaScript-sida ger fel',()=>{let failed=false;try{extractContent('<script>loadApp()</scr'+'ipt>','https://example.com/');}catch(error){failed=error.code==='EMPTY_CONTENT';}assert(failed,'tom import måste markeras för reservhämtning');});
const photo=extractContent('<section><h1>Hej</h1><img src="/photo.jpg" width="1200" height="800"></section>','https://example.com/');
check('foto utan alt blir inte logo',()=>assert(photo.hero==='https://example.com/photo.jpg'&&!photo.logo,'foto blev logo'));
const hidden=extractContent('<section><h2>Desktop</h2><p>Text</p></section><section class="hide-lg"><h1>Mobilkopia</h1></section>','https://example.com/');
check('dold responsiv kopia tas bort',()=>assert(hidden.headline==='Desktop'&&!hidden.cards.length,'mobilkopia kom med'));
const customHeader=extractContent('<div class="ed-logo logo"><a href="/sv"><img src="/brand.png" alt="example.com"></a></div><main><h1>Hej</h1><section><h2>Våra kunder</h2><img src="/customer-logo.png" alt="Kundkommun"></section></main>','https://example.com/sv/');
check('kundens logo ersätts aldrig av en partnerlogo',()=>assert(customHeader.logo==='https://example.com/brand.png',customHeader.logo));
const wp=extractContent('<style>.entry-title{display:none}</style><nav><a class="skip-link" href="#main">Hoppa till innehåll</a><a role="button" href="#menu">Meny</a><ul><li><a href="/">Hem</a></li><li><a href="/contact">Kontakt</a></li></ul></nav><main id="main"><h1 class="entry-title">Hem</h1><section><h2>Synlig introduktion</h2><p>Rätt intro.</p><img src="/portrait.jpg"></section></main>','https://example.com/');
check('CSS-dold sidtitel ersätter inte synlig rubrik',()=>assert(wp.headline==='Synlig introduktion'&&wp.hero==='https://example.com/portrait.jpg',wp.headline));
check('menykontroller och hopplänkar blir inte menyalternativ',()=>assert(wp.navigation.map(n=>n.label).join(',')==='Hem,Kontakt',JSON.stringify(wp.navigation)));
const responsive=extractContent('<style>.responsive{display:none}@media(min-width:800px){.responsive{display:block}}</style><section class="responsive"><h1>Behåll vid osäker synlighet</h1><p>Intro</p></section>','https://example.com/');
check('villkorlig CSS döljer inte desktopinnehåll',()=>assert(responsive.headline==='Behåll vid osäker synlighet',responsive.headline));
const elementor=extractContent('<div data-elementor-type="header"><a href="/"><img src="/brand.png" alt=""></a></div><main><section><h2>Riktig hero</h2><p>Intro.</p><img data-src="/customer-150x150.png" src="data:image/png;base64,AA"></section><section><h2>Tjänst</h2><img src="/service.jpg"></section></main>','https://example.com/');
check('sidbyggarens headerlogo hittas',()=>assert(elementor.logo==='https://example.com/brand.png',elementor.logo));
check('små kundporträtt blir inte huvudbild',()=>assert(!elementor.hero,elementor.hero));
const nested=extractContent('<main><h1>Böcker</h1><p>Introduktion.</p><article><img src="/book.jpg"><h2>Första boken</h2><p>Bokens text.</p></article><section><h2>Bara rubrik</h2></section><section><p>Separat text utan rubrik.</p><img src="/unrelated.jpg"></section><section><h2>Sista</h2><p>Sista text.</p></section></main>','https://example.com/');
check('nästa blocks bild lånas inte till föregående rubrik',()=>assert(!nested.hero&&nested.cards[0].image==='https://example.com/book.jpg',JSON.stringify(nested.cards)));
check('tom sektion lånar inte text och bild från nästa',()=>assert(!nested.cards[1].description&&!nested.cards[1].image,JSON.stringify(nested.cards[1])));
const print=extractContent('<style media="print">.hero{display:none}</style><main><section class="hero"><h1>Synlig på skärm</h1><p>Intro</p></section><h2>Senare</h2></main>','https://example.com/');
check('utskrifts-CSS döljer inte skärminnehåll',()=>assert(print.headline==='Synlig på skärm',print.headline));
const dropdown=extractContent('<nav><a href="/services" aria-controls="submenu" aria-expanded="false">Tjänster</a><a href="#submenu" aria-controls="submenu">Öppna meny</a></nav><h1>Hej</h1>','https://example.com/');
check('menylänk med undermeny behåller sin destination',()=>assert(dropdown.navigation.length===1&&dropdown.navigation[0].label==='Tjänster',JSON.stringify(dropdown.navigation)));
const cafe=extractContent('<title>Anrikt café mitt i stan | cafeorion.se</title><header><a href="/"><img src="/logo.png"></a></header><main><div class="carousel"><div class="item active"><img src="/cafe.jpg"></div></div><section><h1>Café Orion - ett café med anor</h1></section><section><h2>Sortiment</h2><p>Vårt sortiment.</p></section></main>','https://www.cafeorion.se/');
check('tydligt varumärkesnamn går före SEO-rubrik',()=>assert(cafe.name==='Café Orion',cafe.name));
check('originalets inledande bildspel kan bli huvudbild',()=>assert(cafe.hero==='https://www.cafeorion.se/cafe.jpg',cafe.hero));
const laterCarousel=extractContent('<main><section><h1>Intro utan bild</h1></section><section><h2>Galleri</h2><div class="carousel"><div class="active"><img src="/later.jpg"></div></div></section></main>','https://example.com/');
check('senare bildspel lånas inte till huvudrubriken',()=>assert(!laterCarousel.hero,laterCarousel.hero));
const pageStyles=extractContent('<head><meta property="og:site_name" content="Optinet - Säker IT-drift |"><link rel="stylesheet" href="/themes/generic.css"><link rel="stylesheet" href="/themes/generic-two.css"><link id="elementor-post-5049-css" rel="stylesheet" href="/css/kit.css"><link id="elementor-post-12140-css" rel="stylesheet" href="/css/page.css"><link id="elementor-post-999-css" rel="stylesheet" href="/css/footer.css"></head><body class="elementor-kit-5049"><main data-elementor-type="wp-page" data-elementor-id="12140"><h1>IT för ditt företag</h1></main></body>','https://www.optinet.se/');
check('sidans egna designstilar prioriteras framför generiskt tema',()=>assert(pageStyles.stylesheets.slice(0,2).join(',')==='https://www.optinet.se/css/kit.css,https://www.optinet.se/css/page.css',pageStyles.stylesheets.join(',')));
check('SEO-suffix tas bort när företagsnamnet matchar domänen',()=>assert(pageStyles.name==='Optinet',pageStyles.name));
const lazyBackground=extractContent('<main><section><h1>Intro</h1></section><article><div class="elementor-cta__bg" style="background-image:inherit" data-bg-image="url(/support.jpg)" aria-label="Vår support"></div><h2>Support</h2><p>Hjälp från vårt team.</p></article><article><div data-background="/drift.jpg"></div><h2>Drift</h2><p>Säker drift.</p></article></main>','https://example.com/');
check('lazy-bakgrund behåller rätt innehållsblock',()=>assert(lazyBackground.cards[0].image==='https://example.com/support.jpg'&&lazyBackground.cards[1].image==='https://example.com/drift.jpg'&&!lazyBackground.hero,JSON.stringify(lazyBackground.cards)));
const logoName=extractContent('<title>Välkommen till vår hemsida</title><header><a href="/"><img alt="Nord & Syd" src="/brand.svg"></a></header><main><h1>Välkommen</h1></main>','https://ns.example/');
check('namnet på identifierad headerlogo går före generisk SEO-titel',()=>assert(logoName.name==='Nord & Syd',logoName.name));
check('relativa stilmallar hör till originalets domän',()=>{const p=extractContent('<link rel="stylesheet" href="https://cdn.example/framework.css"><link rel="stylesheet" href="/_css/style.css"><link rel="stylesheet" href="/_css/layout.css"><h1>Hej</h1>','https://company.example/');assert(p.stylesheets[0]==='https://company.example/_css/style.css',p.stylesheets.join(','));});
check('felaktig stilmallsadress förstör inte importen',()=>{const p=extractContent('<link rel="stylesheet" href="http://["><link rel="stylesheet" href="/valid.css"><h1>Hej</h1>','https://company.example/');assert(p.stylesheets.length===1&&p.headline==='Hej','importen tappades');});
check('subdomänens rubrik ersätter inte företagets namn',()=>{const p=extractContent('<meta property="og:site_name" content="Acme"><h1>Shop</h1>','https://shop.acme.com/');assert(p.name==='Acme',p.name);});
check('CSS-färger och gradienter blir inte bildadresser',()=>{for(const value of ['#fff','radial-gradient(red, blue)','red']){const p=extractContent(`<section><h1>Hej</h1><div data-background="${value}"></div><img src="/real.jpg"></section>`,'https://example.com/');assert(p.hero==='https://example.com/real.jpg'&&p.images.length===1,p.hero);}});
check('tydligt webbplatsnamn ersätts inte av en generisk domänrubrik',()=>{const p=extractContent('<meta property="og:site_name" content="Acme"><h1>Shop</h1>','https://shop.com/');assert(p.name==='Acme',p.name);});
const menuChoice=extractContent('<header><nav class="utility"><a href="/support">Support</a></nav><ul class="max-mega-menu"><li><a href="/services">Tjänster</a><ul><li><a href="/hosting">Hosting</a></li></ul></li><li><a href="/about">Om oss</a></li><li><a href="/contact">Kontakt</a></li></ul></header><main><h1>Välkommen</h1></main>','https://example.com/');
check('huvudmeny väljs före extra meny',()=>assert(menuChoice.navigation.map(n=>n.label).join(',')==='Tjänster,Om oss,Kontakt',JSON.stringify(menuChoice.navigation)));
const landmarkMenu=extractContent('<header><nav aria-label="Sociala medier"><a href="https://instagram.com/company">Instagram</a></nav><nav aria-label="Huvudmeny"><a href="/services">Tjänster</a><a href="/contact">Kontakt</a></nav></header><h1>Välkommen</h1>','https://example.com/');
check('märkt huvudnavigation väljs före sociala länkar',()=>assert(landmarkMenu.navigation[0]?.label==='Tjänster',JSON.stringify(landmarkMenu.navigation)));
const plainContact=extractContent('<main><h1>Café</h1></main><aside><p>Telefon: 033-41 31 86<br>Öppettider 05.00-20.00</p><p>E-post: info@example.com</p><p>Österlånggatan 51<br>503 37 Borås</p></aside>','https://example.com/');
check('kontaktuppgifter i vanlig text importeras',()=>assert(plainContact.phone==='033-41 31 86'&&plainContact.email==='info@example.com',JSON.stringify({phone:plainContact.phone,email:plainContact.email})));
check('uttrycklig gatuadress med postnummer bevaras',()=>assert(plainContact.address==='Österlånggatan 51, 503 37 Borås',plainContact.address));
const noContact=extractContent('<h1>Vårt företag</h1><p>Org.nr: 556123-4567</p><p>Öppet 08.00-17.00</p><p>Order 123456789</p>','https://example.com/');
check('organisationsnummer och öppettider blir inte telefon',()=>assert(!noContact.phone,noContact.phone));
const preferredContact=extractContent('<h1>Hej</h1><a href="tel:+46701234567">Ring</a><a href="mailto:kontakt@example.com">Mejla</a><footer><p>Telefon: 08-123 45 67</p><p>E-post: annan@example.com</p></footer>','https://example.com/');
check('explicita kontaktlänkar går före texttolkning',()=>assert(preferredContact.phone==='+46701234567'&&preferredContact.email==='kontakt@example.com','kontaktlänk ersattes'));
const smallCard=extractContent('<main><section><h1>Intro</h1></section><section><h2>Sortiment</h2><p><img src="/lemon.png" width="200" height="116">Vårt sortiment.</p></section></main>','https://example.com/');
check('mindre innehållsbild bevaras i sitt kort',()=>assert(smallCard.cards[0].image==='https://example.com/lemon.png'&&!smallCard.hero,smallCard.cards[0].image));
const lazySet=extractContent('<section><h1>Hej</h1><img src="data:image/gif;base64,R0lGODlhAQABAIAAAAUEBA==" data-srcset="/large.jpg 1600w, /small.jpg 400w"></section>','https://example.com/');
check('lazy srcset ersätter platshållare med riktig bild',()=>assert(lazySet.hero==='https://example.com/large.jpg',lazySet.hero));
check('tomma bildkällor blir inte webbplatsens adress',()=>{const p=extractContent('<section><h1>Hej</h1><img src="data:image/gif;base64,AA"><img srcset=""><img srcset=", /real.jpg 2x"></section>','https://example.com/');assert(p.images.length===1&&p.hero==='https://example.com/real.jpg',JSON.stringify(p.images));});
check('tom menyknapp före huvudmenyn väljs inte som navigation',()=>{const p=extractContent('<header><button class="header-menu-toggle">Meny</button><nav><a href="/">Hem</a><a href="/media">Media</a></nav></header><h1>Hej</h1>','https://example.com/');assert(p.navigation.length===2,JSON.stringify(p.navigation));});
check('kontakt i sidfoten går före exempel i brödtext',()=>{const p=extractContent('<main><h1>Hej</h1><p>Exempel: E-post: kund@annatbolag.se</p><p>Exempel: Telefon: 08-9999999</p></main><footer><p>E-post: kontakt@example.com</p><p>Telefon: 08-1234567</p></footer>','https://example.com/');assert(p.email==='kontakt@example.com'&&p.phone==='08-1234567',JSON.stringify({email:p.email,phone:p.phone}));});
check('kommatecken i srcset-bildadresser bevaras',()=>{const p=extractContent('<section><h1>Hej</h1><img src="data:image/gif;base64,AA" data-srcset="https://res.cloudinary.com/demo/image/upload/c_fill,w_1200/photo.jpg 1200w, /small.jpg 400w"></section>','https://example.com/');assert(p.hero==='https://res.cloudinary.com/demo/image/upload/c_fill,w_1200/photo.jpg',p.hero);});
check('undermeny utan egen målsida bevarar sina riktiga länkar',()=>{const p=extractContent('<nav><ul><li><a href="/services">Tjänster</a><ul><li><a href="/hosting">Hosting</a></li></ul></li><li><a href="#" aria-haspopup="true">Om oss</a><ul><li><a href="/team">Teamet</a></li><li><a href="/contact">Kontakt</a></li></ul></li></ul></nav><h1>Hej</h1>','https://example.com/');assert(p.navigation.map(n=>n.label).join(',')==='Tjänster,Teamet,Kontakt',JSON.stringify(p.navigation));});
check('ensam srcset-bild utan storleksangivelse bevaras',()=>{const p=extractContent('<section><h1>Hej</h1><img srcset="/large.jpg"></section>','https://example.com/');assert(p.hero==='https://example.com/large.jpg',p.hero);});
check('knappbaserad undermeny behåller sina länkar',()=>{const p=extractContent('<nav><ul><li><button>Tjänster</button><ul><li><a href="/hosting">Hosting</a></li></ul></li></ul></nav><h1>Hej</h1>','https://example.com/');assert(p.navigation[0]?.href==='https://example.com/hosting',JSON.stringify(p.navigation));});
check('modern sidbyggartext i div bevaras utan knappetiketter',()=>{const p=extractContent('<main><section><h1>Vi hjälper er</h1><div class="intro"><span>Originalets riktiga introduktion.</span></div><a href="/boka"><div>Boka möte</div></a></section><section><h2>Tjänster</h2><div>Rätt brödtext.</div></section></main>','https://example.com/');assert(p.description==='Originalets riktiga introduktion.'&&p.cards[0].description==='Rätt brödtext.',JSON.stringify(p));});
check('responsiv bild används i hög upplösning före liten src',()=>{const p=extractContent('<section><h1>Hej</h1><img src="/photo-150x150.jpg" srcset="/photo-600x400.jpg 600w, /photo-1800x1200.jpg 1800w"></section>','https://example.com/');assert(p.hero==='https://example.com/photo-1800x1200.jpg',p.hero);});
check('CSS-bakgrunder tillhör rätt block och stilmallsadress',()=>{const p=extractContent('<main><section class="hero"><h1>Intro</h1><p>Rätt intro</p></section><section class="service"><h2>Service</h2><p>Rätt tjänst</p></section></main>','https://example.com/',[{css:'.hero{background-image:url(../images/hero.jpg)}.service{background-image:url(../images/service.jpg)}',url:'https://cdn.example/css/site.css'}]);assert(p.hero==='https://cdn.example/images/hero.jpg'&&p.cards[0].image==='https://cdn.example/images/service.jpg',JSON.stringify({hero:p.hero,cards:p.cards}));});
check('osäkra CSS-bakgrunder lånas inte från hover eller mobilregel',()=>{const p=extractContent('<main><section class="hero"><h1>Intro</h1></section></main>','https://example.com/',[{css:'.hero:hover{background-image:url(/hover.jpg)}@media(max-width:600px){.hero{background-image:url(/mobile.jpg)}}',url:'https://example.com/theme.css'}]);assert(!p.hero,p.hero);});
check('sidans dekorativa bakgrund blir inte huvudbild',()=>{const p=extractContent('<div class="page"><div class="carousel"><div class="active"><img src="/photo.jpg"></div></div><div><h1>Intro</h1></div><div><h2>Tjänster</h2></div></div>','https://example.com/','.page{background:url(/shadow.png)}');assert(p.hero==='https://example.com/photo.jpg',p.hero);});
check('riktig innehållsbild går före CSS-dekoration i samma block',()=>{const p=extractContent('<section class="hero"><h1>Intro</h1><img src="/team.jpg"></section>','https://example.com/','.hero{background:url(/texture.png) repeat}');assert(p.hero==='https://example.com/team.jpg',p.hero);});
check('explicit lazy-bild går före vanlig platshållar-srcset',()=>{const p=extractContent('<section><h1>Intro</h1><img data-src="/hero.jpg" src="/placeholder.svg" srcset="/placeholder.svg 1x"></section>','https://example.com/');assert(p.hero==='https://example.com/hero.jpg',p.hero);});
check('CSS-konflikter och borttagen bakgrund väljs inte automatiskt',()=>{for(const css of ['.hero{background:url(/a.jpg)}.hero{background:none}', '.hero{background:url(/a.jpg)}.hero{background:url(/b.jpg)}']){const p=extractContent('<section class="hero"><h1>Intro</h1></section>','https://example.com/',css);assert(!p.hero,p.hero);}});
check('mindre sektionsbild prioriteras framför CSS-bakgrund',()=>{const p=extractContent('<main><h1>Intro</h1><section class=service><h2>Service</h2><img src=/service.png width=200 height=116></section></main>','https://example.com/','.service{background:url(/texture.png)}');assert(p.cards[0].image==='https://example.com/service.png',p.cards[0].image);});
check('FAQ behåller både frågan och dess svar i rätt ordning',()=>{const p=extractContent('<main><h1>Hej</h1><section><h2>Vanliga frågor</h2><details><summary>Vad erbjuder ni?</summary><p>Vi erbjuder service.</p></details><details><summary>Var finns ni?</summary><p>Vi finns i Borås.</p></details></section></main>','https://example.com/');assert(p.cards[0].description==='Vad erbjuder ni?\n\nVi erbjuder service.\n\nVar finns ni?\n\nVi finns i Borås.',p.cards[0].description);});
check('bild från picture används när img bara är en platshållare',()=>{const p=extractContent('<main><section><h1>Hej</h1><picture><source type="image/webp" srcset="/small.webp 400w, /large.webp 1400w"><img src="data:image/gif;base64,AA" alt="Vårt café"></picture></section></main>','https://example.com/');assert(p.hero==='https://example.com/large.webp',p.hero);});
check('huvudknappens färg kan hämtas från dess stilmall',()=>{const p=extractContent('<main><section><h1>Hej</h1><p>Välkommen</p><a class="book" href="/book">Boka</a></section></main>','https://example.com/','.book{background-color:#bd244b;color:white}.book:hover{background-color:#111111}');assert(p.accent==='#bd244b',p.accent);});
check('picture lånar inte en mobilbild till desktop',()=>{const p=extractContent('<section><h1>Hej</h1><picture><source media="(max-width:600px)" srcset="/mobile.webp"><source type="image/webp" data-srcset="/desktop.webp 2x"><img src="/fallback.jpg"></picture></section>','https://example.com/');assert(p.hero==='https://example.com/desktop.webp',p.hero);});
check('picture utan generell source använder img utan att låna grannbild',()=>{const p=extractContent('<main><section><h1>Hej</h1><picture><source media="(max-width:600px)" srcset="/mobile.webp"><img src="/fallback.jpg"></picture></section><section><h2>Team</h2><picture><source srcset="/team.webp"><img src="data:image/gif;base64,AA"></picture></section></main>','https://example.com/');assert(p.hero==='https://example.com/fallback.jpg'&&p.cards[0].image==='https://example.com/team.webp',JSON.stringify({hero:p.hero,cards:p.cards}));});
check('tvetydig eller transparent knappfärg väljs inte automatiskt',()=>{for(const css of ['.book{background:#123456}@media(max-width:600px){.book{background:#abcdef}}','.book{background:rgba(10,20,30,.5)}','.book:hover{background:#123456}','.book{background:#123456}.book{background:none}']){const p=extractContent('<section><h1>Hej</h1><a class="book" href="/book">Boka</a></section>','https://example.com/',css);assert(p.accent==='#cdeb60',p.accent+' '+css);}});
check('FAQ duplicerar inte nästlad text eller dolda frågor',()=>{const p=extractContent('<main><h1>Hej</h1><section><h2>Frågor</h2><details><summary><div>Fråga ett?</div></summary><div>Svar ett.</div></details><details hidden><summary>Dold fråga?</summary><p>Dolt svar.</p></details></section></main>','https://example.com/');assert(p.cards[0].description==='Fråga ett?\n\nSvar ett.',p.cards[0].description);});
check('menylänken Start får inte bli företagsnamn',()=>{const p=extractContent('<title>Acme</title><header><nav><a href="/">Start</a></nav></header><main><h1>Vi hjälper dig</h1></main>','https://example.com/');assert(p.name==='Acme',p.name);});
check('dold dekoration får inte ersätta originalets huvudbild',()=>{const p=extractContent('<main><section><h1>Hej</h1><img aria-hidden="true" src="/decoration.jpg" width="1000" height="600"><img src="/real.jpg" width="1000" height="600"></section></main>','https://example.com/');assert(p.hero==='https://example.com/real.jpg',p.hero);});
check('citattext behålls i sitt eget innehållsblock',()=>{const p=extractContent('<main><h1>Hej</h1><section><h2>Våra kunder</h2><blockquote>Det fungerade fint.</blockquote></section><section><h2>Team</h2><p>Teamets text.</p></section></main>','https://example.com/');assert(p.cards[0].description==='Det fungerade fint.'&&p.cards[1].description==='Teamets text.',JSON.stringify(p.cards));});
check('aria-hidden på synlig bild tar inte bort företagets foto',()=>{const p=extractContent('<main><section><h1>Hej</h1><div aria-hidden="true"><img src="/team.jpg" width="1000" height="600"></div></section></main>','https://example.com/');assert(p.hero==='https://example.com/team.jpg',p.hero);});
check('separata etiketter klistras inte ihop till ett ord',()=>{const p=extractContent('<main><h1>Hej</h1><section><h2>Verktyg</h2><div class="tags"><span>Manuscript import</span><span>Chapter editor</span></div></section></main>','https://example.com/');assert(p.cards[0].description==='Manuscript import\n\nChapter editor',p.cards[0].description);});
check('citat med flera rubriker blandar inte ihop deras text',()=>{const p=extractContent('<main><h1>Hej</h1><section><blockquote><h2>Första</h2><p>Första text.</p><h2>Andra</h2><p>Andra text.</p></blockquote></section></main>','https://example.com/');assert(p.cards[0].description==='Första text.'&&p.cards[1].description==='Andra text.',JSON.stringify(p.cards));});
check('senaste giltiga knappfärg följer CSS-kaskaden',()=>{const p=extractContent('<section><h1>Hej</h1><a class="book" href="/book">Boka</a></section>','https://example.com/','.book{background:#123456}.book{background:#abcdef}');assert(p.accent==='#abcdef',p.accent);});
check('länkad CSS före inline-regler behåller dokumentordningen',()=>{const p=extractContent('<head><link rel="stylesheet" href="/style.css"><style>.book{background:#bd244b}</style></head><section><h1>Hej</h1><a class="book" href="/book">Boka</a></section>','https://example.com/',[{url:'https://example.com/style.css',css:'.book{background:#123456}'}]);assert(p.accent==='#bd244b',p.accent);});
check('sen sidstilmall finns med när företaget delar CSS i flera filer',()=>{const html='<head>'+Array.from({length:6},(_,i)=>'<link rel="stylesheet" href="/chunk'+i+'.css">').join('')+'</head><h1>Hej</h1>';const p=extractContent(html,'https://example.com/');assert(p.stylesheets.includes('https://example.com/chunk5.css'),p.stylesheets.join(','));});
check('flera bilder och bildtexter stannar i sitt eget avsnitt',()=>{const p=extractContent('<main><section><h1>Hej</h1><img src="/hero1.jpg"><img src="/hero2.jpg"></section><section><h2>Team</h2><p>Vårt team.</p><figure><img src="/anna.jpg" alt="Anna"><figcaption>Anna, grundare</figcaption></figure><figure><img src="/ali.jpg" alt="Ali"><figcaption>Ali, designer</figcaption></figure></section><section><h2>Kontor</h2><img src="/office.jpg"></section></main>','https://example.com/');assert(p.heroGallery?.length===2,'hero gallery');assert(p.cards[0].gallery?.length===2&&p.cards[0].gallery[1].caption==='Ali, designer','team gallery');assert(p.cards[1].image==='https://example.com/office.jpg'&&!p.cards[0].gallery.some(i=>i.url.includes('office')),'neighbor leaked');});
check('bildgrupp mellan introduktion och nästa underrubrik behålls',()=>{const p=extractContent('<main><section><h1>Start</h1></section><section><div><h2>Teamet</h2><p>Introduktion.</p></div><div role="group"><button><img src="/anna.jpg">Anna – designer</button><button><img src="/ali.jpg">Ali – utvecklare</button></div><div><h3>Vårt arbetssätt</h3><p>Nästa text.</p></div></section></main>','https://example.com/');assert(p.cards[0].gallery?.length===2,'sibling photos missing');assert(p.cards[0].gallery[1].caption==='Ali – utvecklare','identity lost');assert(!p.cards[1].image&&p.cards[1].description==='Nästa text.','text/image leak');});
check('bildetiketter separerar namn och roll utan dekorativa nummer',()=>{const p=extractContent('<main><h1>Hej</h1><section><h2>Team</h2><button><span aria-hidden="true">01</span><img src="/anna.jpg"><span>Anna</span><span>Designer</span></button><button><img src="/ali.jpg"><span>Ali</span><span>Utvecklare</span></button></section></main>','https://example.com/');assert(p.cards[0].gallery[0].caption==='Anna Designer',p.cards[0].gallery[0].caption);});
check('importerad CSS ligger före värdfilens egna regler',()=>{const p=extractContent('<head><link rel="stylesheet" href="/theme.css"></head><main><h1>Hej</h1><p>Text.</p></main>','https://example.com/',[{url:'https://example.com/base.css',importedBy:'https://example.com/theme.css',css:'h1{font-family:Base}'},{url:'https://example.com/theme.css',css:'h1{font-family:Main}'}]);assert(p.typography?.heading==='Main',p.typography?.heading);});
check('färgprofil följer med importen',()=>{const p=extractContent('<style>body{background:#faf8f3;color:#202020}header{background:#202020;color:white}main p{color:#555555}</style><header><a href="/"><img src="/white.svg"></a></header><main><h1>Hej</h1><p>Text.</p></main>','https://example.com/');assert(p.branding?.background==='#faf8f3'&&p.branding?.headerBackground==='#202020','profil saknas');});
check('inline headerlogo finns som tillfällig bildkälla utan att SVG körs',()=>{const p=extractContent('<header><a href="/"><svg viewBox="0 0 100 20"><path fill="black" d="M0 0h100v20H0z"/></svg></a></header><main><h1>Hej</h1></main>','https://example.com/');assert(p.inlineLogo?.startsWith('<svg')&&!p.logo,'inline logo saknas');});
document.getElementById('results').textContent=outcomes.join('\n');
</script></body></html>
