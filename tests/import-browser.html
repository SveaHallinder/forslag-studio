<!doctype html><html lang="sv"><meta charset="utf-8"><title>Importtester</title><body><h1>Importtester med riktig DOM</h1><pre id="results">Kör…</pre><script type="module">
import {extractContent} from '/import-content.mjs';
const outcomes=[];
const check=(name,fn)=>{try{fn();outcomes.push('PASS '+name);}catch(e){outcomes.push('FAIL '+name+': '+e.message);}};
const assert=(ok,msg)=>{if(!ok)throw Error(msg);};
const html=`<html><head><title>Acme | Startsida</title><meta name="description" content="SEO-text som inte ska ersätta sidans introduktion"><style>:root{--brand-primary:#b63552}</style></head><body><header><a href="/"><img src="/acme.svg" alt="Acme" width="100"></a><nav><a href="/#repair">Reparation</a><a href="/team">Vårt team</a></nav></header><main><section id="intro"><div><h1>Vi lagar det du älskar</h1><p>Originalets riktiga introduktion.</p><a href="/book">Boka reparation</a></div><img src="/hero.jpg" width="1600" height="1000"></section><section id="repair"><article><img src="/repair.jpg" width="600" height="400"><div><h2>Reparation</h2><p>Första stycket.</p><p>Andra stycket.</p><ul><li>Med garanti</li><li>På plats</li></ul></div></article><article><h2>Service</h2><p>Service har ingen bild.</p></article></section><aside hidden><h2>Dold mobilkopia</h2></aside><div id="cookie-banner"><h2>Vi använder cookies</h2><p>Godkänn kakor.</p></div></main><footer><img src="/partner.jpg" width="900" height="600"><a href="mailto:info@acme.example">Mejla oss</a></footer></body></html>`;
const p=extractContent(html,'https://acme.example/');
check('synlig copy före metadata',()=>assert(p.description==='Originalets riktiga introduktion.',p.description));
check('meny bevaras',()=>assert(p.navigation?.[0].label==='Reparation'&&p.navigation[1].label==='Vårt team','meny saknas'));
check('hero och logotyp separeras',()=>assert(p.hero==='https://acme.example/hero.jpg'&&p.logo==='https://acme.example/acme.svg','fel hero eller logo'));
check('sektion behåller stycken och lista',()=>assert(p.cards.find(c=>c.title==='Reparation')?.description==='Första stycket.\n\nAndra stycket.\n\nMed garanti\n\nPå plats',JSON.stringify(p.cards)));
check('rätt bild inom sektion',()=>assert(p.cards.find(c=>c.title==='Reparation')?.image==='https://acme.example/repair.jpg'&&!p.cards.find(c=>c.title==='Service')?.image,'bild kopplad till fel text'));
check('dolt innehåll och kakdialog bort',()=>assert(!p.cards.some(c=>/Dold|cookies/.test(c.title)),'skräpinnehåll'));
check('originalets CTA',()=>assert(p.cta==='Boka reparation'&&p.ctaHref==='https://acme.example/book','CTA saknas'));
check('uttrycklig brandfärg',()=>assert(p.accent==='#b63552',p.accent));
const flat=extractContent('<main><h1>Hero</h1><p>Intro.</p><img src="/hero.jpg"><h2>Service</h2><p>Rätt text.</p><img src="/service.jpg"><h2>Annat</h2><p>Ingen bild.</p></main>','https://example.com/');
check('platt HTML blandar inte sektioner',()=>assert(flat.description==='Intro.'&&flat.cards[0].description==='Rätt text.'&&flat.cards[0].image==='https://example.com/service.jpg'&&!flat.cards[1].image,JSON.stringify(flat.cards)));
const semantic=extractContent('<header><nav><a href="/team">Team</a></nav></header><main><section><header><h2>Första synliga rubriken</h2></header><p>Intro.</p></section><section><h1>Senare rubrik</h1><p>Senare text.</p></section></main><footer><nav><a href="/privacy">Privacy</a></nav></footer>','https://example.com/');
check('sektionens header och visuell ordning bevaras',()=>assert(semantic.headline==='Första synliga rubriken',semantic.headline));
check('footer blir inte huvudmeny',()=>assert(semantic.navigation.length===1&&semantic.navigation[0].label==='Team',JSON.stringify(semantic.navigation)));
const contact=extractContent('<h1>Kontakt</h1><a href="tel:+46%2070%20123%204567">Ring</a><a href="mailto:info%40example.com">Mail</a>','https://example.com/');
check('kodade kontaktlänkar behålls',()=>assert(contact.phone==='+46 70 123 4567'&&contact.email==='info@example.com','kontakt tappades'));
check('tom JavaScript-sida ger fel',()=>{let failed=false;try{extractContent('<script>loadApp()</scr'+'ipt>','https://example.com/');}catch{failed=true;}assert(failed,'tom import godkändes');});
const photo=extractContent('<section><h1>Hej</h1><img src="/photo.jpg" width="1200" height="800"></section>','https://example.com/');
check('foto utan alt blir inte logo',()=>assert(photo.hero==='https://example.com/photo.jpg'&&!photo.logo,'foto blev logo'));
const hidden=extractContent('<section><h2>Desktop</h2><p>Text</p></section><section class="hide-lg"><h1>Mobilkopia</h1></section>','https://example.com/');
check('dold responsiv kopia tas bort',()=>assert(hidden.headline==='Desktop'&&!hidden.cards.length,'mobilkopia kom med'));
const customHeader=extractContent('<div class="ed-logo logo"><a href="/sv"><img src="/brand.png" alt="example.com"></a></div><main><h1>Hej</h1><section><h2>Våra kunder</h2><img src="/customer-logo.png" alt="Kundkommun"></section></main>','https://example.com/sv/');
check('kundens logo ersätts aldrig av en partnerlogo',()=>assert(customHeader.logo==='https://example.com/brand.png',customHeader.logo));
const wp=extractContent('<style>.entry-title{display:none}</style><nav><a class="skip-link" href="#main">Hoppa till innehåll</a><a role="button" href="#menu">Meny</a><ul><li><a href="/">Hem</a></li><li><a href="/contact">Kontakt</a></li></ul></nav><main id="main"><h1 class="entry-title">Hem</h1><section><h2>Synlig introduktion</h2><p>Rätt intro.</p><img src="/portrait.jpg"></section></main>','https://example.com/');
check('CSS-dold sidtitel ersätter inte synlig rubrik',()=>assert(wp.headline==='Synlig introduktion'&&wp.hero==='https://example.com/portrait.jpg',wp.headline));
check('menykontroller och hopplänkar blir inte menyalternativ',()=>assert(wp.navigation.map(n=>n.label).join(',')==='Hem,Kontakt',JSON.stringify(wp.navigation)));
const responsive=extractContent('<style>.responsive{display:none}@media(min-width:800px){.responsive{display:block}}</style><section class="responsive"><h1>Behåll vid osäker synlighet</h1><p>Intro</p></section>','https://example.com/');
check('villkorlig CSS döljer inte desktopinnehåll',()=>assert(responsive.headline==='Behåll vid osäker synlighet',responsive.headline));
const elementor=extractContent('<div data-elementor-type="header"><a href="/"><img src="/brand.png" alt=""></a></div><main><section><h2>Riktig hero</h2><p>Intro.</p><img data-src="/customer-150x150.png" src="data:image/png;base64,AA"></section><section><h2>Tjänst</h2><img src="/service.jpg"></section></main>','https://example.com/');
check('sidbyggarens headerlogo hittas',()=>assert(elementor.logo==='https://example.com/brand.png',elementor.logo));
check('små kundporträtt blir inte huvudbild',()=>assert(!elementor.hero,elementor.hero));
const nested=extractContent('<main><h1>Böcker</h1><p>Introduktion.</p><article><img src="/book.jpg"><h2>Första boken</h2><p>Bokens text.</p></article><section><h2>Bara rubrik</h2></section><section><p>Separat text utan rubrik.</p><img src="/unrelated.jpg"></section><section><h2>Sista</h2><p>Sista text.</p></section></main>','https://example.com/');
check('nästa blocks bild lånas inte till föregående rubrik',()=>assert(!nested.hero&&nested.cards[0].image==='https://example.com/book.jpg',JSON.stringify(nested.cards)));
check('tom sektion lånar inte text och bild från nästa',()=>assert(!nested.cards[1].description&&!nested.cards[1].image,JSON.stringify(nested.cards[1])));
const print=extractContent('<style media="print">.hero{display:none}</style><main><section class="hero"><h1>Synlig på skärm</h1><p>Intro</p></section><h2>Senare</h2></main>','https://example.com/');
check('utskrifts-CSS döljer inte skärminnehåll',()=>assert(print.headline==='Synlig på skärm',print.headline));
const dropdown=extractContent('<nav><a href="/services" aria-controls="submenu" aria-expanded="false">Tjänster</a><a href="#submenu" aria-controls="submenu">Öppna meny</a></nav><h1>Hej</h1>','https://example.com/');
check('menylänk med undermeny behåller sin destination',()=>assert(dropdown.navigation.length===1&&dropdown.navigation[0].label==='Tjänster',JSON.stringify(dropdown.navigation)));
const cafe=extractContent('<title>Anrikt café mitt i stan | cafeorion.se</title><header><a href="/"><img src="/logo.png"></a></header><main><div class="carousel"><div class="item active"><img src="/cafe.jpg"></div></div><section><h1>Café Orion - ett café med anor</h1></section><section><h2>Sortiment</h2><p>Vårt sortiment.</p></section></main>','https://www.cafeorion.se/');
check('tydligt varumärkesnamn går före SEO-rubrik',()=>assert(cafe.name==='Café Orion',cafe.name));
check('originalets inledande bildspel kan bli huvudbild',()=>assert(cafe.hero==='https://www.cafeorion.se/cafe.jpg',cafe.hero));
const laterCarousel=extractContent('<main><section><h1>Intro utan bild</h1></section><section><h2>Galleri</h2><div class="carousel"><div class="active"><img src="/later.jpg"></div></div></section></main>','https://example.com/');
check('senare bildspel lånas inte till huvudrubriken',()=>assert(!laterCarousel.hero,laterCarousel.hero));
const pageStyles=extractContent('<head><meta property="og:site_name" content="Optinet - Säker IT-drift |"><link rel="stylesheet" href="/themes/generic.css"><link rel="stylesheet" href="/themes/generic-two.css"><link id="elementor-post-5049-css" rel="stylesheet" href="/css/kit.css"><link id="elementor-post-12140-css" rel="stylesheet" href="/css/page.css"><link id="elementor-post-999-css" rel="stylesheet" href="/css/footer.css"></head><body class="elementor-kit-5049"><main data-elementor-type="wp-page" data-elementor-id="12140"><h1>IT för ditt företag</h1></main></body>','https://www.optinet.se/');
check('sidans egna designstilar prioriteras framför generiskt tema',()=>assert(pageStyles.stylesheets.join(',')==='https://www.optinet.se/css/kit.css,https://www.optinet.se/css/page.css',pageStyles.stylesheets.join(',')));
check('SEO-suffix tas bort när företagsnamnet matchar domänen',()=>assert(pageStyles.name==='Optinet',pageStyles.name));
const lazyBackground=extractContent('<main><section><h1>Intro</h1></section><article><div class="elementor-cta__bg" style="background-image:inherit" data-bg-image="url(/support.jpg)" aria-label="Vår support"></div><h2>Support</h2><p>Hjälp från vårt team.</p></article><article><div data-background="/drift.jpg"></div><h2>Drift</h2><p>Säker drift.</p></article></main>','https://example.com/');
check('lazy-bakgrund behåller rätt innehållsblock',()=>assert(lazyBackground.cards[0].image==='https://example.com/support.jpg'&&lazyBackground.cards[1].image==='https://example.com/drift.jpg'&&!lazyBackground.hero,JSON.stringify(lazyBackground.cards)));
const logoName=extractContent('<title>Välkommen till vår hemsida</title><header><a href="/"><img alt="Nord & Syd" src="/brand.svg"></a></header><main><h1>Välkommen</h1></main>','https://ns.example/');
check('namnet på identifierad headerlogo går före generisk SEO-titel',()=>assert(logoName.name==='Nord & Syd',logoName.name));
check('relativa stilmallar hör till originalets domän',()=>{const p=extractContent('<link rel="stylesheet" href="https://cdn.example/framework.css"><link rel="stylesheet" href="/_css/style.css"><link rel="stylesheet" href="/_css/layout.css"><h1>Hej</h1>','https://company.example/');assert(p.stylesheets[0]==='https://company.example/_css/style.css',p.stylesheets.join(','));});
check('felaktig stilmallsadress förstör inte importen',()=>{const p=extractContent('<link rel="stylesheet" href="http://["><link rel="stylesheet" href="/valid.css"><h1>Hej</h1>','https://company.example/');assert(p.stylesheets.length===1&&p.headline==='Hej','importen tappades');});
check('subdomänens rubrik ersätter inte företagets namn',()=>{const p=extractContent('<meta property="og:site_name" content="Acme"><h1>Shop</h1>','https://shop.acme.com/');assert(p.name==='Acme',p.name);});
check('CSS-färger och gradienter blir inte bildadresser',()=>{for(const value of ['#fff','radial-gradient(red, blue)','red']){const p=extractContent(`<section><h1>Hej</h1><div data-background="${value}"></div><img src="/real.jpg"></section>`,'https://example.com/');assert(p.hero==='https://example.com/real.jpg'&&p.images.length===1,p.hero);}});
check('tydligt webbplatsnamn ersätts inte av en generisk domänrubrik',()=>{const p=extractContent('<meta property="og:site_name" content="Acme"><h1>Shop</h1>','https://shop.com/');assert(p.name==='Acme',p.name);});
document.getElementById('results').textContent=outcomes.join('\n');
</script></body></html>
