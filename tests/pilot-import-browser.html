<!doctype html><html lang="sv"><meta charset="utf-8"><title>Pilotimport</title><body><h1>Pilotimport med riktig DOM</h1><pre id="results">Kör…</pre><script type="module">
import {extractContent} from '/import-content.mjs';
const outcomes=[];
const check=(name,fn)=>{try{fn();outcomes.push('PASS '+name);}catch(e){outcomes.push('FAIL '+name+': '+e.message);}};
const assert=(ok,msg)=>{if(!ok)throw Error(msg);};
const source='https://example.com/';
const locations=extractContent(`<header><nav><a href="#first">Första platsen</a><a href="/about">Om oss</a></nav></header><main><section><h1>Synlighet</h1><img src="/hero.jpg"></section><section><ul><li id="first"><img src="/first.jpg" alt="Första skärmen"><div><h2>Första platsen</h2><div><p>Storlek: 5 kvm</p><p>Första platsen är öppen varje dag.</p><ul><li>Utomhus</li><li>Nära centrum</li></ul></div></div></li><li id="second"><img src="/second.jpg" alt="Andra skärmen"><div><h2>Andra platsen</h2><p>Storlek: 8 kvm</p></div></li></ul></section><section><h2>Kontakt</h2><p>Hör av dig.</p></section></main>`,source);
check('kort i lista skiljer rubrik från stycken och behåller listtext',()=>assert(locations.cards[0].description==='Storlek: 5 kvm\n\nFörsta platsen är öppen varje dag.\n\nUtomhus\n\nNära centrum',locations.cards[0].description));
check('nästa kort behåller egen beskrivning utan rubrik',()=>assert(locations.cards[1].description==='Storlek: 8 kvm',locations.cards[1].description));
check('källordning, bilder och etiketter bevaras',()=>assert(locations.cards.map(c=>c.title).join('|')==='Första platsen|Andra platsen|Kontakt'&&locations.cards[0].image===source+'first.jpg'&&locations.cards[1].image===source+'second.jpg'&&locations.cards[0].gallery[0].label==='Första skärmen',JSON.stringify(locations.cards)));
check('meny och ankaröversättning bevaras',()=>assert(locations.navigation[0].href==='#section-1'&&locations.navigation[1].href===source+'about'&&locations.sourceAnchors.second==='section-2',JSON.stringify(locations.navigation)));
const video=extractContent(`<main><section data-current-styles='{"backgroundMode":"video","backgroundImage":{"assetUrl":"/fallback.jpg"}}'><video poster="/active-video-poster.jpg"></video><h1>Synlighet</h1></section><section><h2>Platser</h2><img src="/unrelated.jpg"></section></main>`,source);
check('videons uttryckliga poster går före sektionens reservbild',()=>assert(video.hero===source+'active-video-poster.jpg',video.hero));
check('hero-galleri behåller originalets bildkällor och rätt primärbild',()=>assert(video.heroGallery[0].url===video.hero&&video.heroGallery.some(i=>i.url===source+'fallback.jpg')&&!video.heroGallery.some(i=>i.url===source+'unrelated.jpg'),JSON.stringify(video.heroGallery)));
const fallback=extractContent(`<main><section data-current-styles='{"backgroundMode":"video","backgroundImage":{"assetUrl":"/fallback.jpg"}}'><div data-config-native-video='{"filename":"source.mov"}'></div><h1>Synlighet</h1></section><section><h2>Platser</h2><img src="/unrelated.jpg"></section></main>`,source);
check('video utan poster behåller konfigurerad reservbild utan att låna ett annat kort',()=>assert(fallback.hero===source+'fallback.jpg',fallback.hero));
check('video utan poster förklarar att stillbilden är en reservbild',()=>assert(fallback.warnings.some(w=>/reservbild/i.test(w)&&/video/i.test(w)),fallback.warnings.join('\n')));
const hidden=extractContent(`<main><section data-current-styles='{"backgroundImage":{"assetUrl":"/desktop.jpg"}}'><div hidden><video poster="/hidden-mobile.jpg"></video></div><h1>Synlighet</h1></section></main>`,source);
check('dold videosyskonbild påverkar inte hero',()=>assert(hidden.hero===source+'desktop.jpg',hidden.hero));
const partners=extractContent(`<main><section><h1>Synlighet</h1><img src="/hero.jpg"></section><section id="partners"><div class="user-items-list"><div class="list-section-title"><p>Ett urval av våra partners</p></div><ul><li><img src="/arrow-icon.png" alt="Nästa" width="100" height="100"></li>${Array.from({length:14},(_,i)=>`<li><img src="/partner-${i}${i===1?'':'-logo'}.png" alt="Partner ${i}" width="420" height="95"></li>`).join('')}</ul></div></section><section><h2>Nästa avsnitt</h2><img src="/other-logo.png" alt="Logotyp" width="500" height="200"><p>Nästa text.</p></section></main>`,source);
check('uttrycklig listtitel blir eget avsnitt i källordning',()=>assert(partners.cards.map(c=>c.title).join('|')==='Ett urval av våra partners|Nästa avsnitt',JSON.stringify(partners.cards)));
check('partnerlogotyper behåller ordning och etiketter med samma gallerigräns',()=>assert(partners.cards[0].gallery?.length===12&&partners.cards[0].gallery[0].url===source+'partner-0-logo.png'&&partners.cards[0].gallery[11].label==='Partner 11'&&partners.warnings.some(w=>w.includes('fler än 12')),JSON.stringify(partners.cards[0])));
check('listtitel blir inte duplicerad beskrivning och ikon lånas inte in',()=>assert(partners.cards[0].description===''&&!partners.cards[0].gallery?.some(i=>/icon|other-logo/.test(i.url))&&partners.cards[1].description==='Nästa text.'&&!partners.cards[1].image,JSON.stringify(partners.cards)));
const semanticTitle=extractContent('<main><section><h1>Start</h1></section><section><div class="list-section-title"><h2>Våra partners</h2></div><ul><li><img src="/partner.jpg"></li></ul></section><section><div class="list-section-title"><p>En lös etikett</p></div></section></main>',source);
check('semantisk rubrik dupliceras inte och lös etikett blir inte avsnitt',()=>assert(semanticTitle.cards.length===1&&semanticTitle.cards[0].title==='Våra partners',JSON.stringify(semanticTitle.cards)));
const groupTitle=extractContent('<main><section><h1>Start</h1></section><section><div class="user-items-list"><div class="list-section-title"><p>Utforska våra lägen</p></div><ul><li><img src="/first.jpg"><h2>Första platsen</h2><p>Storlek: 5 kvm</p></li><li><img src="/second.jpg"><h2>Andra platsen</h2><p>Storlek: 8 kvm</p></li></ul></div></section></main>',source);
check('listtitel före underrubriker lånar inte första kortets text eller bild',()=>assert(groupTitle.cards.length===3&&groupTitle.cards[0].title==='Utforska våra lägen'&&!groupTitle.cards[0].description&&!groupTitle.cards[0].image&&!groupTitle.cards[0].gallery&&groupTitle.cards[1].description==='Storlek: 5 kvm'&&groupTitle.cards[1].image===source+'first.jpg',JSON.stringify(groupTitle.cards)));
const inlineList=extractContent('<main><section><h1>Start</h1></section><section><ul><li><h2>Plats A</h2>Storlek: <strong>5 kvm</strong><p>Öppet varje dag.</p></li></ul></section></main>',source);
check('direkt listtext och inline-element bevaras före stycket utan rubrik',()=>assert(inlineList.cards[0].description==='Storlek: 5 kvm\n\nÖppet varje dag.',inlineList.cards[0].description));
const mixedList=extractContent('<main><section><h1>Start</h1></section><section><ul><li><div><h2>Plats <strong>B</strong></h2>Storlek: <strong>8 kvm</strong><p>Öppet varje dag.</p>Efter <em>stycket</em><ul><li>Utomhus</li><li>Utomhus</li></ul></div></li><li><h2>Plats C</h2><p>Egen text.</p></li></ul></section></main>',source);
check('listkort behåller blandad textordning och upprepade listpunkter',()=>assert(mixedList.cards[0].description==='Storlek: 8 kvm\n\nÖppet varje dag.\n\nEfter stycket\n\nUtomhus\n\nUtomhus'&&mixedList.cards[1].description==='Egen text.',JSON.stringify(mixedList.cards)));
document.getElementById('results').textContent=outcomes.join('\n');
</script></body></html>
