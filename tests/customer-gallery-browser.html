<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bildvisare QA</title><style>body{margin:24px;font:14px/1.6 system-ui;background:#f4f1e8;color:#21352b}header{display:flex;gap:12px;flex-wrap:wrap;align-items:center}button,select{min-height:44px;padding:10px 16px}iframe{display:block;border:0;margin-top:24px;background:white}pre{white-space:pre-wrap}.tester{position:absolute;left:-3000px}</style></head><body><header><button id="run">Testa bildvisaren · 17 designer</button><label>Design <select id="design"></select></label><label>Bredd <select id="width"><option>375</option><option>320</option><option>820</option><option>1280</option></select></label><button id="keyboard">Prova tangentbord</button><button id="broken">Prova trasig bild</button></header><pre id="results" role="status">Illustrativa QA-bilder. Ingen ändring sparas i kundprojekt.</pre><iframe id="preview" width="375" height="850" title="Kundens bildgalleri"></iframe><script type="module">
import {renderDemo} from '/render.mjs';import {templates} from '/templates.mjs';import {installCustomerGallery} from '/customer-gallery.mjs';import {installPreviewEditing} from '/preview-edit.mjs';
const photo=(color,label)=>{const canvas=document.createElement('canvas');canvas.width=1200;canvas.height=900;const ctx=canvas.getContext('2d');ctx.fillStyle=color;ctx.fillRect(0,0,1200,900);ctx.fillStyle='#f4f1e8';ctx.beginPath();ctx.arc(600,370,220,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f4f1e8';ctx.font='40px Georgia';ctx.textAlign='center';ctx.fillText(label,600,720);return canvas.toDataURL();};
const a=photo('#536e59','Illustrativ bild A'),b=photo('#93563f','Illustrativ bild B'),gallery=[{url:a,label:'Bild A',caption:'Företagets första bildtext.'},{url:b,label:'Bild B',caption:'Företagets andra bildtext.'}];
const base={name:'Ateljé Nord · QA',headline:'Rum för livet.',source:'https://company.example/',importedAt:'today',description:'Ett illustrativt exempel på kundens bildgalleri.',hero:a,heroGallery:gallery,email:'qa@company.example',address:'Torget 4',cards:[{title:'Våra bilder',anchor:'bilder',gallery},{title:'Våra partners',kind:'logos',gallery}],navigation:[{label:'Om oss',href:'https://company.example/about'},{label:'Kontakt',href:'#kontakt'}],pages:[{source:'https://company.example/about',headline:'Människorna bakom',cards:[{title:'Bilder från vår plats',gallery:[{url:b,label:'Undersidans bild',caption:'Bildtext från undersidan.'}]}]}]};
const preview=document.getElementById('preview'),out=document.getElementById('results'),design=document.getElementById('design');design.innerHTML=templates.map(t=>`<option value="${t.id}">${t.name}</option>`).join('');design.value='gallery';
function refresh(broken=false){preview.width=document.getElementById('width').value;preview.srcdoc=renderDemo({...base,templateId:design.value,...(broken?{hero:'/assets/qa-missing-image.jpg',heroGallery:[{url:'/assets/qa-missing-image.jpg',label:'Trasig QA-bild'},...gallery]}:{})});}
design.onchange=()=>refresh();document.getElementById('width').onchange=()=>refresh();document.getElementById('broken').onclick=()=>refresh(true);document.getElementById('keyboard').onclick=()=>{preview.contentDocument.querySelector('.customer-image-open')?.focus();out.textContent='Tryck Enter för att öppna, piltangenter för att bläddra och Escape för att stänga.';};refresh();
document.getElementById('run').onclick=async()=>{
 const frame=document.createElement('iframe');frame.className='tester';frame.height=850;document.body.append(frame);let cases=0;const failures=[];
 const load=html=>new Promise(resolve=>{frame.onload=resolve;frame.srcdoc=html;});
 const waitImage=d=>new Promise(resolve=>{const image=d.querySelector('.customer-image-stage img');if(!image||image.complete)return resolve();image.addEventListener('load',resolve,{once:true});image.addEventListener('error',resolve,{once:true});});
 for(const {id}of templates)for(const width of [320,375,820,1280]){
  frame.width=width;await load(renderDemo({...base,templateId:id}));const d=frame.contentDocument,w=frame.contentWindow;await d.fonts.ready;d.__disposeSiteMotion?.();const check=(ok,msg)=>{if(!ok)failures.push(`${id}/${width}: ${msg}`);};cases++;
  const original=d.querySelector('.card .section-gallery img'),trigger=d.querySelector('.card:not(.section-logos) .customer-image-open');check(!!trigger,'öppningsknapp saknas');if(!trigger)continue;
  check(!d.querySelector('.card[data-composition=logos] .customer-image-open'),'logotyper får bildvisare');const hit=trigger.getBoundingClientRect();check(hit.width>=44&&hit.height>=44,'tryckyta mindre än 44 px');check(d.documentElement.scrollWidth<=width+1,'horisontell scroll');
  const before=original.getAttribute('style');trigger.click();await waitImage(d);const dialog=d.querySelector('.customer-image-dialog');check(dialog.open,'bildvisaren öppnas inte');check(d.activeElement===dialog.querySelector('[data-image-close]'),'fokus hamnar inte på Stäng');check(d.documentElement.style.overflow==='hidden','bakgrunden scrollar');
  const rect=dialog.getBoundingClientRect();check(rect.left>=0&&rect.right<=width+1&&rect.top>=0&&rect.bottom<=850+1,'bildvisaren ryms inte');check(d.querySelector('[data-image-caption]').textContent==='Företagets första bildtext.','bildtext saknas');
  const full=d.querySelector('.customer-image-stage img');check(w.getComputedStyle(full).objectFit==='contain','hela bilden visas inte');check(!dialog.getAnimations().length,'tangentbord öppnar med rörelse');
  dialog.dispatchEvent(new w.KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true}));await waitImage(d);check(dialog.querySelector('[data-image-count]').textContent==='2 av 2','pil bläddrar inte');check(d.querySelector('[data-image-caption]').textContent==='Företagets andra bildtext.','fel bildtext');
  dialog.querySelector('[data-image-next]').click();await waitImage(d);check(dialog.querySelector('[data-image-count]').textContent==='1 av 2','bläddring runt galleriet');dialog.close();await new Promise(resolve=>w.requestAnimationFrame(resolve));check(d.activeElement===trigger,'fokus återställs inte');check(d.documentElement.style.overflow==='','scroll återställs inte');check(original.getAttribute('style')===before,'originalutsnitt ändras');
  const undoEdit=installPreviewEditing(d,{onSelect:()=>{}});check(w.getComputedStyle(trigger).display==='none','kontroller syns i redigeringsläge');undoEdit();check(w.getComputedStyle(trigger).display!=='none','kontroller återställs inte efter redigering');
  const media=w.matchMedia.bind(w);w.matchMedia=query=>query==='(prefers-reduced-motion: reduce)'?{matches:true,addEventListener(){},removeEventListener(){}}:media(query);installCustomerGallery(d);const reduced=d.querySelector('.card:not(.section-logos) .customer-image-open');reduced.dispatchEvent(new w.MouseEvent('click',{bubbles:true,detail:1}));await waitImage(d);check(!d.querySelector('.customer-image-dialog').getAnimations({subtree:true}).length,'reducerad rörelse ignoreras');d.querySelector('[data-image-close]').click();w.matchMedia=media;
  d.querySelector('.nav-links a[data-demo-target="1"]').click();await new Promise(resolve=>w.requestAnimationFrame(resolve));const sub=d.querySelector('.card .customer-image-open');check(!!sub,'undersidans bildvisare saknas');sub?.click();await waitImage(d);check(d.querySelector('[data-image-caption]').textContent==='Bildtext från undersidan.','undersidan använder startsidans bilder');check(d.querySelector('[data-image-next]').hidden,'enstaka bild visar bläddring');check(d.querySelectorAll('.customer-image-dialog').length===1,'dubbla bildvisare');d.querySelector('[data-image-close]').click();
  out.textContent=`${cases} bildflöden kontrollerade…`;
 }
 frame.width=375;await load(renderDemo({...base,pages:undefined,hero:'/assets/qa-missing-image.jpg',heroGallery:[{url:'/assets/qa-missing-image.jpg',label:'Trasig QA-bild'}]}));frame.contentDocument.querySelector('.customer-image-open').click();await waitImage(frame.contentDocument);if(!frame.contentDocument.querySelector('.customer-image-stage [role=status]').textContent.includes('kunde inte laddas'))failures.push('Trasig bild saknar tydligt felmeddelande');
 await load(renderDemo({...base,pages:undefined}).replace(/<script\b[\s\S]*?<\/script>/g,''));if(frame.contentDocument.querySelector('.customer-image-open')||!frame.contentDocument.querySelector('figcaption')||!frame.contentDocument.querySelector('.section-gallery img'))failures.push('Utan JS saknas originalbilder eller bildtexter');
 frame.remove();document.title=failures.length?'FAIL gallery':'PASS gallery';out.textContent=failures.length?'FAIL\n'+failures.join('\n'):`PASS ${cases} bildflöden · 17 designer · 320/375/820/1280 · fokus · bläddring · undersidor · reducerad rörelse · redigering · felbild · utan JS`;
};
</script></body></html>
