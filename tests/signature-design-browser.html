<!doctype html><html lang="sv"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fem helhetsstilar – QA</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e9ebe5;font:14px system-ui;color:#242b24}header{padding:20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:20px;margin:0 auto 0 0}button,select{font:inherit;min-height:44px;border:1px solid #c1c9be;background:#fff;padding:10px 16px;border-radius:6px;cursor:pointer}button[aria-pressed=true]{background:#243327;color:white}pre{white-space:pre-wrap;padding:0 20px;margin:0 0 20px}iframe{display:block;border:0;background:white;margin:auto;max-width:100%}#stage{overflow:auto;padding:0 0 20px}.test-frame{position:absolute;left:-1600px;max-width:none}small{display:block;padding:0 20px 20px;color:#566250}</style>
<header><h1>Fem helhetsstilar</h1><select aria-label="Exempelinnehåll" id="example"><option value="cafe">Café · Pebble-underlag</option><option value="projects">Projekt · Vegavista-underlag</option><option value="text">Tjänster · illustrativt QA-innehåll</option></select><select aria-label="Förhandsvisningsbredd" id="width"><option value="1280">Desktop · 1280</option><option value="820">Tablet · 820</option><option value="375">Mobil · 375</option></select><button id="run">Kör kontroller</button></header>
<header id="styles"></header><small>Lokalt QA-underlag. Café- och projektbilder kommer från befintliga pilotförslag. Tjänsteexemplet är illustrativt. Inga kundprojekt sparas här.</small><pre id="results">Välj stil och scrolla hela sidan.</pre><div id="stage"><iframe id="preview" title="Förhandsvisning av helhetsstil" height="1000"></iframe></div>
<script type="module">
import {renderDemo,normalizeProject} from '/render.mjs';
import {getTemplate} from '/templates.mjs';
const ids=['story','studio','editorial','cinema','pop'],frame=document.getElementById('preview'),out=document.getElementById('results');let selected='story';
const pilot=await fetch('/pebble-social-pilot.json').then(r=>r.json()),seed=await fetch('/seed.json').then(r=>r.json());
const long='Vi utgår från platsen, materialet och människorna som använder den. Varje uppdrag får sitt eget uttryck, med omsorg om funktion och detaljer. '.repeat(3);
const examples={cafe:{name:pilot.name,eyebrow:pilot.eyebrow,headline:pilot.headline,description:pilot.bio,accent:'#d1b59b',hero:pilot.photos[0].url,importedAt:'today',address:pilot.address,cta:'Visit Pebble',ctaHref:'#visit',navigation:[{label:'Our coffee',href:'#coffee'},{label:'The café',href:'#cafe'},{label:'Visit',href:'#visit'},{label:'Instagram',href:pilot.links}],cards:[{title:pilot.offerTitle,description:pilot.offer,anchor:'coffee',image:pilot.photos[1].url},{title:'The café',anchor:'cafe'},{title:'A little room for your daily ritual.',description:pilot.about,image:pilot.photos[2].url},{title:'An autumn coffee',description:pilot.bio,image:pilot.photos[3].url},{title:'Visit Pebble',description:pilot.hours,anchor:'visit'}]},projects:{...seed,logo:'',importedAt:'today',ctaHref:'#kontakt',navigation:[{label:'Platser',href:'#platser'},{label:'Om oss',href:'#om'},{label:'Kontakt',href:'#kontakt'}],cards:[{title:'Platser för ditt budskap',anchor:'platser'},...seed.cards,{title:seed.aboutTitle,description:seed.about,image:seed.hero}]},text:{name:'Ateljé Nord · QA',eyebrow:'Illustrativt designexempel',headline:'Rum att leva i. Platser att längta till.',description:'Ett illustrativt exempel med enbart text, för att prova hur olika designer hanterar tjänster och längre innehåll.',accent:'#b45735',email:'qa@example.com',cta:'Prata om ditt projekt',ctaHref:'#kontakt',importedAt:'today',navigation:[{label:'Vårt arbetssätt',href:'#process'},{label:'Kontakt',href:'#kontakt'}],cards:[{title:'Ett genomtänkt arbetssätt',description:long,anchor:'process'},{title:'Från första skiss till sista detalj',description:long+'\n\n'+long},{title:'Vad händer i ett första möte?',kind:'faq',description:'Vi går igenom era behov, förutsättningar och frågor. Texten är illustrativ och används enbart för QA.'}]}};
frame.addEventListener('load',async()=>{const d=frame.contentDocument;await Promise.all([...d.images].map(img=>{img.loading='eager';return img.decode().catch(()=>{});}));frame.height=Math.max(1000,d.documentElement.scrollHeight);});
function preview(){frame.height=1000;frame.width=document.getElementById('width').value;frame.srcdoc=renderDemo({...examples[document.getElementById('example').value],templateId:selected});for(const button of document.querySelectorAll('[data-style]'))button.setAttribute('aria-pressed',String(button.dataset.style===selected));}
document.getElementById('styles').innerHTML=ids.map(id=>`<button data-style="${id}" aria-pressed="${id===selected}">${getTemplate(id).name}</button>`).join('');
document.getElementById('styles').addEventListener('click',event=>{if(event.target.dataset.style){selected=event.target.dataset.style;preview();}});
for(const id of ['example','width'])document.getElementById(id).addEventListener('change',preview);
preview();
document.getElementById('run').addEventListener('click',async()=>{
  const tester=document.createElement('iframe');tester.className='test-frame';tester.height=900;tester.title='Automatiska layoutkontroller';document.body.append(tester);
  const image='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7',base={...examples.text,hero:image,cards:[{title:'Vårt utbud',anchor:'process'},{title:'Första exemplet',description:'Kort originaltext.',image},{title:'Andra exemplet',description:'Annan kort originaltext.',image},{title:'En bildberättelse',description:long,image},{title:'En till bildberättelse',description:long,image},{title:'Kundens galleri',description:long,gallery:[{url:image,label:'Kundens bild',caption:'Originalets bildtext',presentation:{fit:'contain',ratio:'portrait',x:12,y:74}},{url:'data:image/gif;base64,R0lGODlhAQABAIAAAP8AAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7',label:'Andra bilden'}]},{title:'Vad händer i ett första möte?',kind:'faq',description:long},{title:'Nästa steg',href:'https://example.com/next'}]},failures=[],signatures=new Set();let cases=0;
  const variants={normal:()=>base,brand:()=>({...base,branding:{background:'#16332b',text:'#fcf4e8',headerBackground:'#fcf4e8',headerText:'#16332b'}}),accent:()=>({...base,accent:'#173b2d'}),person:()=>({...base,name:'Maria Exempel',headline:'Författare och konstnär',description:'Maria skapar berättelser och konst. '+long,logo:image,cards:[...base.cards,{title:'En illustrativ bok',description:long,gallery:[{url:image,label:'Bokomslag',presentation:{fit:'contain',ratio:'portrait',x:50,y:50}}]}]}),font:()=>({...base,typography:{heading:'Georgia',body:'Arial'}}),long:()=>({...base,name:('Ett mycket långt företagsnamn ').repeat(3),headline:('En lång kundrubrik med allt sitt innehåll ').repeat(4),cards:base.cards.map(card=>({...card,title:card.title+' '+long,description:card.description?long.repeat(5):''}))}),empty:()=>({...base,hero:'',email:'',navigation:[],cards:[]}),manual:()=>({...base,importedAt:'',ctaHref:'',navigation:[],cards:[{title:'En tjänst',description:long},{title:'En annan tjänst',description:long}]}),gallery:()=>({...base,heroGallery:[{url:image,label:'Bild ett',caption:'Bildtext ett'},{url:image,label:'Bild två'}]})};
  const canvas=document.createElement('canvas'),context=canvas.getContext('2d'),luminance=color=>{context.clearRect(0,0,1,1);context.fillStyle=color;context.fillRect(0,0,1,1);return [...context.getImageData(0,0,1,1).data].slice(0,3).map(n=>{n/=255;return n<=.04045?n/12.92:((n+.055)/1.055)**2.4;}).reduce((sum,n,i)=>sum+n*[.2126,.7152,.0722][i],0);};
  for(const templateId of ids)for(const width of [320,375,820,1280])for(const [variant,make]of Object.entries(variants)){
    const raw={...make(),templateId},before=JSON.stringify(raw),p=normalizeProject(raw);tester.width=width;
    await new Promise(resolve=>{tester.onload=resolve;tester.srcdoc=renderDemo(raw);});
    const d=tester.contentDocument,w=tester.contentWindow;await d.fonts.ready;const style=n=>w.getComputedStyle(n),check=(ok,message)=>{if(!ok)failures.push(`${templateId}/${width}/${variant}: ${message}`);};cases++;
    const cards=[...d.querySelectorAll('.cards>.card')];check(cards.length===p.cards.length,'antal sektioner');check(JSON.stringify(raw)===before,'underlag ändrat');check(d.documentElement.scrollWidth<=width+1,'horisontell sidscroll');
    cards.forEach((card,index)=>{const expected=p.cards[index],rect=card.getBoundingClientRect(),heading=card.querySelector('h2,h3,.faq-item summary');check(heading.textContent.replace(/\s*↗\s*$/,'').trim()===expected.title.trim(),'rubrik/ordning '+index);check(card.scrollWidth<=card.clientWidth+2,'sektionsöverflöd '+index);check(rect.left>=-1&&rect.right<=width+1,'sektion utanför sidan '+index);if(expected.description)check(card.textContent.includes(expected.description),'originaltext '+index);if(expected.anchor)check(card.id===expected.anchor,'ankare '+index);const children=[...card.children].filter(child=>style(child).display!=='none');for(let a=0;a<children.length;a++)for(let b=a+1;b<children.length;b++){const x=children[a].getBoundingClientRect(),y=children[b].getBoundingClientRect();check(!(Math.min(x.right,y.right)-Math.max(x.left,y.left)>2&&Math.min(x.bottom,y.bottom)-Math.max(x.top,y.top)>2),'överlappande bild/text '+index);}});
    const footer=d.querySelector('.site-footer');check(footer.scrollWidth<=footer.clientWidth+2,'sidfot överflöd');const nav=d.querySelector('.nav');check(nav.scrollWidth<=nav.clientWidth+2,'meny överflöd');
    if(variant==='accent'||variant==='brand')for(const card of cards){let background=card;while(background.parentElement&&style(background).backgroundColor==='rgba(0, 0, 0, 0)')background=background.parentElement;const bg=luminance(style(background).backgroundColor);for(const text of card.querySelectorAll('h2,h3,p')){const ink=luminance(style(text).color),ratio=(Math.max(ink,bg)+.05)/(Math.min(ink,bg)+.05);check(ratio>=(text.tagName==='P'?4.5:3),'otillräcklig textkontrast');}}
    if(variant==='person'){const hero=d.querySelector('[data-profile=person]');check(!!hero,'personlig hierarki');const name=hero.querySelector('.profile-name'),heading=hero.querySelector('h1'),a=name.getBoundingClientRect(),b=heading.getBoundingClientRect();check(Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top)<=1,'namn/rubrik överlappar');check(style(heading).fontSize.replace('px','')<=34,'yrkesrubrik för stor');check(hero.scrollWidth<=hero.clientWidth+2,'personlig entré överflöd');}if(variant==='font'){check(style(d.querySelector('h1')).fontFamily.includes('Georgia'),'kundens rubrikfont');check(style(d.body).fontFamily.includes('Arial'),'kundens textfont');}
    if(variant==='empty')check(!d.querySelector('img')&&d.querySelector('.contact-empty')?.textContent.includes('saknas'),'tomt underlag');
    if(variant==='normal'){const framed=cards[5].querySelector('img');check(style(framed).objectFit==='contain'&&style(framed).objectPosition==='12% 74%'&&style(framed).aspectRatio==='3 / 4','manuellt bildutsnitt');if(width===1280)signatures.add(JSON.stringify([style(d.querySelector('.hero-layout')).gridTemplateColumns,style(d.querySelector('.hero-image')).borderRadius,style(cards[1]).padding,style(cards[1]).gridColumn,style(cards[3]).gridTemplateColumns,style(footer).display,style(footer).backgroundColor]));}
    out.textContent=`${cases} layoutfall kontrollerade…`;
  }
  if(signatures.size!==5)failures.push('De fem designerna har inte fem olika helhetskompositioner.');tester.remove();document.title=failures.length?'FAIL signature design':'PASS signature design';out.textContent=failures.length?'FAIL\n'+failures.join('\n'):`PASS ${cases} layoutfall · fem olika helhetsstilar · 320/375/820/1280 · originaltext/ankare · bildutsnitt · egna typsnitt · mörk branding · långa texter · tomma och manuella utkast`;
});
</script></html>
