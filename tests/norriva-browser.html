<!doctype html><html lang="sv"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Norriva · mallgranskning</title><style>body{font:14px system-ui;margin:20px;background:#edf1f5}header{display:flex;gap:12px;align-items:center}button,select{font:inherit;padding:12px}iframe{display:block;border:0;margin-top:20px}pre{white-space:pre-wrap}</style><header><button id="run">Testa Norriva</button><label>Bredd <select id="width"><option>1280</option><option>820</option><option>390</option><option>320</option></select></label><a id="standalone" target="_blank">Öppna hela sidan</a></header><pre id="results" role="status">Norriva-referens lokalt. Inget kundprojekt ändras.</pre><iframe id="preview" width="1280" height="900" title="Norriva-förhandsvisning"></iframe><script type="module">
import {renderDemo} from '/render.mjs';import {encodeProject} from '/share.mjs';
const p=await(await fetch('/concepts/norriva-fixture.json')).json(),frame=document.querySelector('#preview'),out=document.querySelector('#results');
function show(){frame.width=document.querySelector('#width').value;frame.srcdoc=renderDemo(p);}document.querySelector('#width').onchange=show;show();
document.querySelector('#standalone').href=URL.createObjectURL(new Blob([renderDemo(p)],{type:'text/html'}));
document.querySelector('#run').onclick=async()=>{let checks=0;const failures=[],check=(ok,msg)=>{checks++;if(!ok)failures.push(msg);};
for(const size of [320,390,820,1280])for(const mode of ['source','text','custom','long']){
 const input={...p,...(mode==='text'?{hero:'',heroGallery:[],logo:'',cards:[]}:{})},f=document.createElement('iframe');f.style.cssText='position:absolute;left:-10000px;width:'+size+'px;height:900px';document.body.append(f);
 if(mode==='custom')input.typography={heading:'Georgia',body:'Verdana'};if(mode==='long'){input.name='Ett väldigt långt företagsnamn som ska rymmas på hela sidan';input.navigation=[...p.navigation,...p.navigation];input.cta='Kontakta oss för att prata igenom ert nästa projekt och allt ni behöver';input.ctaHref='mailto:qa@example.com';}
 const before=JSON.stringify(input);await new Promise(resolve=>{f.onload=resolve;f.srcdoc=renderDemo(input);});const d=f.contentDocument,w=f.contentWindow;await d.fonts.ready;const prefix=size+'/'+mode+': ';
 check(d.documentElement.scrollWidth<=size+1,prefix+'horisontell scroll');check(JSON.stringify(input)===before,prefix+'underlaget bevarat');check(d.querySelectorAll('h1').length===1,prefix+'en huvudrubrik');check(d.querySelectorAll('.cards>.card').length===input.cards.length,prefix+'alla sektioner');
 const h=d.querySelector('h1'),hr=h.getBoundingClientRect();check(hr.left>=0&&hr.right<=size+1,prefix+'rubriken ryms');
 check(w.getComputedStyle(h).fontWeight==='300',prefix+'lätt rubrikvikt');check(w.getComputedStyle(h).fontFamily.includes(mode==='custom'?'Georgia':'Norriva Sans'),prefix+'typsnitt');
 check(!!d.querySelector('a[href="mailto:norrivapack@gmail.com"]'),prefix+'riktig kontaktväg');
 const label=d.querySelector('.ending-action-label');check(label.getBoundingClientRect().width>20&&w.getComputedStyle(label).clipPath==='none',prefix+'synlig kontaktknapp');
 for(const card of d.querySelectorAll('.cards>.card')){const r=card.getBoundingClientRect();check(r.left>=0&&r.right<=size+1&&card.scrollWidth<=card.clientWidth+1,prefix+'sektionen ryms');}
 if(size<761){const menu=d.querySelector('.mobile-menu summary');menu.click();check(d.querySelector('.mobile-menu').open,prefix+'menyn öppnas');menu.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));check(!d.querySelector('.mobile-menu').open,prefix+'Escape stänger');}
 if(mode==='source'){const products=[...d.querySelectorAll('[data-redesign-role=product]')].map(n=>n.getBoundingClientRect());check(size<=760?products[1].top>=products[0].bottom:Math.abs(products[1].top-products[0].top)<2,prefix+'produktkortens kolumner');const faq=d.querySelector('.faq-item');faq.querySelector('summary').click();check(faq.open,prefix+'FAQ öppnas');}
 f.remove();out.textContent=checks+' kontroller körda…';
}
const f=document.createElement('iframe');f.style.cssText='position:absolute;left:-10000px;width:390px;height:850px';document.body.append(f);const small={...p,hero:'',heroGallery:[],logo:'',cards:[],navigation:[]};f.src=await encodeProject(small,new URL('/demo.html',location.href).href);const start=performance.now();while(!f.contentDocument?.querySelector('[data-website-design=norriva]')&&performance.now()-start<10000)await new Promise(resolve=>requestAnimationFrame(resolve));check(!!f.contentDocument?.querySelector('[data-website-design=norriva]'),'kundlänken behåller Norriva');f.remove();out.textContent=failures.length?'FAIL '+checks+'\n'+failures.join('\n'):'PASS '+checks+' · Norriva · 4 bredder · lång text · text utan bild · egna typsnitt · meny · produkter · FAQ · kundlänk';};
</script></html>
