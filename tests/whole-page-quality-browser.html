<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hela sidan QA</title><link rel="stylesheet" href="/studio.css"><link rel="stylesheet" href="/design-workbench.css"><style>body{padding:24px;background:#f7f8f3}header.qa{display:flex;gap:12px;flex-wrap:wrap;align-items:center}pre{white-space:pre-wrap;max-width:1000px}iframe{display:block;border:0;background:white;margin-top:24px}.tester{position:absolute;left:-2000px;top:0}</style></head><body><header class="qa"><button class="button primary" id="review">Öppna genomgång</button><button class="button secondary" id="run">Testa 17 designer</button><button class="button secondary" id="stale">Simulera ny redigering</button><button class="button secondary" id="restore">Återställ QA-utkast</button><label>Förhandsbredd <select id="width"><option>375</option><option>320</option><option>1280</option></select></label></header><pre id="results" role="status">Redo. Alla uppgifter och bilder är illustrativa QA-data.</pre><p id="editTarget"></p><iframe id="preview" title="Kundens mobilvy" width="375" height="850"></iframe><script type="module">
import {renderDemo,normalizeProject} from '/render.mjs';
import {templates} from '/templates.mjs';
import {createWholePageQuality} from '/whole-page-quality.mjs';
const image=(width,height)=>{const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;const ctx=canvas.getContext('2d');ctx.fillStyle='#596c50';ctx.fillRect(0,0,width,height);ctx.fillStyle='#e8dfca';ctx.beginPath();ctx.arc(width/2,height/2,height/3,0,Math.PI*2);ctx.fill();return canvas.toDataURL();};
const small=image(320,240),large=image(1280,960),long=('Företagets egna ord om tjänsterna och människorna bakom dem ska visas med omsorg och tydliga nästa steg. ').repeat(10);
const base={name:'Ateljé Nord · QA',headline:'Rum för livet.',description:'Ett illustrativt exempel för att granska hela kundsidan.',importedAt:'today',source:'https://company.example/',email:'qa@company.example',phone:'+46 123 456 789',address:'Torget 4',accent:'#596c50',branding:{background:'#f4f1e8',text:'#20352d'},hero:small,heroGallery:[{url:small},{url:large}],navigation:[{label:'Vårt utbud',href:'#utbud'},{label:'Om oss',href:'https://company.example/about'},{label:'Kontakt',href:'#kontakt'}],cards:[{title:'Vårt utbud',anchor:'utbud',description:'Illustrativt innehåll.'},{title:'En berättelse',description:long,image:small},{title:'Nästa steg',description:'Kontakta oss för att diskutera ert projekt.',href:'mailto:qa@company.example'}],pages:[{source:'https://company.example/about',name:'Om oss',headline:'Människorna bakom.',description:'Originaltext på undersidan.',cards:[{title:'TODO rubrik',description:long}]}]};
let project=normalizeProject({...base,templateId:'gallery'}),changes=0;const preview=document.getElementById('preview'),out=document.getElementById('results');
function refresh(){preview.width=document.getElementById('width').value;preview.srcdoc=renderDemo(project).replace('<body ','<body data-motion="static" ');}
const quality=createWholePageQuality({getProject:()=>project,probe:async url=>{const img=new Image();img.src=url;await img.decode();return {width:img.naturalWidth,height:img.naturalHeight};},changed:next=>{project=next;changes++;refresh();out.textContent=`${changes} ändringar · ${project.hero===large?'Stor originalbild':'Liten originalbild'} · ${project.headline}`;},edit:target=>{document.getElementById('editTarget').textContent=JSON.stringify(target);},notify:message=>{out.textContent+='\n'+message;}});
document.getElementById('review').onclick=()=>quality.open();document.getElementById('stale').onclick=()=>{project={...project,headline:'Ny redigering ska bevaras'};refresh();};document.getElementById('restore').onclick=()=>{project=normalizeProject({...base,templateId:'gallery'});refresh();out.textContent='QA-utkast återställt.';};document.getElementById('width').onchange=refresh;refresh();
document.getElementById('run').onclick=async()=>{
 const frame=document.createElement('iframe');frame.className='tester';frame.height=850;document.body.append(frame);const failures=[];let cases=0;
 for(const {id}of templates)for(const width of [320,375,820,1280])for(const lengthy of [false,true]){
  frame.width=width;const p=normalizeProject({...base,templateId:id,pages:undefined,...(lengthy?{cta:'Kontakta oss för ett första samtal om ert nästa projekt och alla detaljer som är viktiga för er',ctaHref:'mailto:qa@company.example'}:{})}),original=JSON.stringify(p);await new Promise(resolve=>{frame.onload=resolve;frame.srcdoc=renderDemo(p).replace('<body ','<body data-motion="static" ');});
  const d=frame.contentDocument,w=frame.contentWindow;await d.fonts.ready;const style=n=>w.getComputedStyle(n),check=(ok,msg)=>{if(!ok)failures.push(`${id}/${width}: ${msg}`);};cases++;
  check(JSON.stringify(p)===original,'underlaget ändrades');check(d.documentElement.scrollWidth<=width+1,'horisontell scroll');
  const bar=d.querySelector('.customer-mobile-actions');check(!!bar,'mobilhandlingar saknas');const visible=style(bar).display!=='none';check(visible===(width<=620),'fel brytpunkt');
  if(visible){const rect=bar.getBoundingClientRect();check(rect.left>=0&&rect.right<=width+1&&rect.height<=100,'handlingsraden ryms inte');check(parseFloat(style(d.body).paddingBottom)>=rect.height+12,'sidfoten har inte plats');for(const a of bar.querySelectorAll('a'))check(a.getBoundingClientRect().height>=44&&a.scrollWidth<=a.clientWidth+1,'knappens tryckyta eller text');const summary=d.querySelector('.mobile-menu summary');if(summary){summary.click();await new Promise(resolve=>w.requestAnimationFrame(resolve));check(style(bar).visibility==='hidden','mobilrad över öppen meny');summary.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));check(!d.querySelector('.mobile-menu').open,'Escape stänger inte menyn');}}
  const ending=d.querySelector('.ending-action-label');if(ending)check(style(ending).clipPath==='none'&&ending.getBoundingClientRect().height>10,'kontaktknappens etikett är dold');
  check([...d.querySelectorAll('.card,.cafe-block')].some(n=>n.textContent.includes(long.trim())),'originaltext saknas');
  for(const a of d.querySelectorAll('.customer-mobile-actions a'))check(/^(mailto:qa@company.example|https:\/\/www.google.com\/maps\/search\/)/.test(a.getAttribute('href')),'uppfunnen kunddestination');
  out.textContent=`${cases} kundsidor kontrollerade…`;
 }
 frame.remove();document.title=failures.length?'FAIL whole-page quality':'PASS whole-page quality';out.textContent=failures.length?'FAIL\n'+failures.join('\n'):`PASS ${cases} kundsidor · 17 designer · 320/375/820/1280 · mobilknappar · meny/Escape · sidfot · bevarad originaltext`;
};
</script></body></html>
