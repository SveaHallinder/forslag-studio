<!doctype html><html lang="sv"><meta charset="utf-8"><title>Legacyimport</title><h1>Legacyimport</h1><pre id="results">Kör…</pre><script type="module">
import {extractContent} from '/import-content.mjs';
const outcomes=[],assert=(condition,message)=>{if(!condition)throw Error(message);},check=(label,test)=>{try{test();outcomes.push('PASS '+label);}catch(error){outcomes.push('FAIL '+label+': '+error.message);}};
const frame=content=>`<div data-muse-type="txt_frame" class="colelem">${content}</div>`;
const fixture=`<head><title>cafe-astrid</title><link rel="stylesheet" href="/css/site.css"></head><body><div class="breakpoint active" data-min-width="961"><div id="intro"><a class="anchor_item" id="top"></a><img width="400" height="310" src="/images/blank.gif" data-orig-src="/images/logo-white.png"></div><div id="visit"><img src="/images/blank.gif" data-muse-src="/images/counter.jpg" width="600" height="400">${frame('<p>ÖPPETTIDER</p><p>Måndag – Fredag 08:00 - 18:00</p><p>Lördag Stängt</p>')}${frame('<p>FRUKOST</p><p>Vardagar 08:00 - 10:00</p>')}</div><div id="divider"></div><a class="anchor_item" id="menu"></a><img src="/images/ribbon.png" width="480" height="78">${frame('<p>MENY</p>')}${frame('<p>MAT &amp; DRYCK</p><p>SOPPA 99:-</p><p>Bröd, ost</p><p>SALLAD 109:-</p><p>Bröd, ost</p><p>Fråga oss om allergier.</p>')}<div id="events"></div><img width="136" height="136" src="/images/blank.gif" data-orig-src="/images/badge.png"><a class="anchor_item" id="events-anchor"></a>${frame('<p>CATERING</p>')}${frame('<p>Mat till ditt sällskap.</p><p>info@cafe-astrid.example</p><p>Tel: 08123456</p>')}<nav><a href="index.html#top">HEM</a><a href="index.html#menu">MENY</a><a href="index.html#events-anchor">CATERING</a></nav><div class="verticalspacer"></div><div>${frame('<p>CAFÉ ASTRID • STORGATAN 3 • 08 123456</p>')}</div></div><div class="breakpoint" data-max-width="960">${frame('<p>MAT &amp; DRYCK</p><p>SOPPA 99:-</p>')}</div></body>`;
const css=`.breakpoint{display:none}.breakpoint.active{display:block}body{color:#000000;background:#ffffff}#intro,#visit,#events{background-size:cover;background-position:center center}#divider{height:22px;background:url(../images/bar.png) repeat-x} @media(min-width:961px),print{#intro{min-height:500px;background-image:url(../images/beans.jpg)}#visit{min-height:400px;background-image:url(../images/interior.jpg)}#events{min-height:350px;background-image:url(../images/food.jpg)}} @media(max-width:960px){#intro{background-image:url(../images/mobile.jpg)}}`;
const run=html=>extractContent(html,'https://www.cafe-astrid.example/',[{url:'https://www.cafe-astrid.example/css/site.css',css}]),p=run(fixture);
check('namn och logotyp från originalet',()=>assert(p.name==='CAFÉ ASTRID'&&p.logo.endsWith('/logo-white.png'),JSON.stringify([p.name,p.logo])));
check('toppfoto skiljs från avsnitt och responsiva kopior',()=>assert(p.hero.endsWith('/beans.jpg')&&p.heroGallery?.length===1&&!p.description,JSON.stringify([p.hero,p.heroGallery,p.description])));
check('visuella rubriker blir ordnade kort',()=>assert(p.cards.map(c=>c.title).join('|')==='ÖPPETTIDER|FRUKOST|MENY|MAT & DRYCK|CATERING',JSON.stringify(p.cards.map(c=>c.title))));
check('öppettider lämnas oförändrade',()=>assert(p.cards[0]?.description==='Måndag – Fredag 08:00 - 18:00\n\nLördag Stängt',p.cards[0]?.description));
check('alla priser och upprepade ingredienser stannar i menygruppen',()=>assert(p.cards.find(c=>c.title==='MAT & DRYCK')?.description==='SOPPA 99:-\n\nBröd, ost\n\nSALLAD 109:-\n\nBröd, ost\n\nFråga oss om allergier.',JSON.stringify(p.cards)));
check('avsnitt behåller sina föregående foton',()=>assert(p.cards[0]?.gallery?.some(i=>i.url.endsWith('/counter.jpg'))&&p.cards.find(c=>c.title==='CATERING')?.gallery?.some(i=>i.url.endsWith('/food.jpg')),JSON.stringify(p.cards)));
check('små grafiska märken visas utan fotobeskärning',()=>assert(p.cards.find(c=>c.title==='CATERING')?.gallery?.find(i=>i.url.endsWith('/badge.png'))?.presentation?.fit==='contain',JSON.stringify(p.cards)));
check('avdelare och placeholders är inte innehållsbilder',()=>assert(!p.heroGallery?.some(i=>/bar|blank|ribbon/.test(i.url))&&!p.cards.some(c=>c.gallery?.some(i=>/bar|blank|ribbon/.test(i.url))),JSON.stringify(p.cards)));
check('menyn leder till importerade avsnitt',()=>assert(p.navigation.map(n=>n.href).join('|')==='#start|#section-3|#section-5',JSON.stringify(p.navigation)));
check('huvudlänken leder till starten',()=>assert(p.navigation[0]?.href==='#start',JSON.stringify(p.navigation)));
check('bakgrundens bildposition behålls',()=>assert(p.heroGallery[0].presentation?.x===50&&p.heroGallery[0].presentation?.y===50,JSON.stringify(p.heroGallery)));
check('radbrytning inuti textstycke bevaras',()=>{const result=run(fixture.replace('<p>SOPPA 99:-</p>','<p>SOPPA 99:-<br>Tomat och basilika</p>'));assert(result.cards.find(c=>c.title==='MAT & DRYCK')?.description.startsWith('SOPPA 99:-\nTomat och basilika'),'line break lost');});
check('befintlig företagsrubrik och introduktion används som hero',()=>{const result=run(fixture.replace('</div><div id="visit">',frame('<p>CAFÉ ASTRID</p><p>Välkommen in till oss.</p>')+'</div><div id="visit">'));assert(result.headline==='CAFÉ ASTRID'&&result.description==='Välkommen in till oss.'&&result.cards[0]?.title==='ÖPPETTIDER',JSON.stringify(result));});
check('kontakt och neutral branding behålls',()=>assert(p.email==='info@cafe-astrid.example'&&p.phone==='08123456'&&p.accent==='#000000'&&p.address==='STORGATAN 3',JSON.stringify([p.email,p.phone,p.accent,p.address])));
check('utan active väljs komplett breakpoint',()=>assert(run(fixture.replace('breakpoint active','breakpoint')).cards.length===5,'wrong breakpoint'));
check('heuristiken rör inte vanliga semantiska sidor',()=>{const result=run('<main><h1>Välkommen</h1><p>MENY</p><p>SOPPA 99:-</p></main>');assert(result.headline==='Välkommen'&&result.cards.length===0,'semantic page changed');});
check('heuristiken rör inte vanlig text utan Muse-markup',()=>{const result=run('<div><p>VÄLKOMMEN</p><p>Vårt café.</p><p>MENY</p><p>SOPPA 99:-</p></div>');assert(!result.cards.length,'non-Muse headings guessed');});
check('cookierubrik hindrar inte Muse-innehåll',()=>{const result=run(fixture.replace('<body>','<body><div id="cookie-banner"><h2>Cookies</h2></div>'));assert(result.cards.length===5&&result.hero.endsWith('/beans.jpg'),'cookie heading disabled fallback');});
check('logotypens företagsnamn går före generisk sidtitel',()=>{const result=run(fixture.replace('<title>cafe-astrid</title>','<title>Hem</title>').replace('src="/images/blank.gif" data-orig-src="/images/logo-white.png"','alt="Astrids kaffehus" src="/images/blank.gif" data-orig-src="/images/logo-white.png"').replace('CAFÉ ASTRID • STORGATAN 3 • 08 123456','Copyright'));assert(result.name==='Astrids kaffehus'&&result.headline==='Astrids kaffehus',result.name);});
check('ankare räknar återstående kort efter deduplicering',()=>{const repeated=frame('<p>NYHETER</p><p>Vi håller öppet.</p>'),result=run(fixture.replace('<a class="anchor_item" id="menu">',repeated+repeated+'<a class="anchor_item" id="menu">'));const menu=result.cards.find(c=>c.title==='MENY');assert(result.cards.filter(c=>c.title==='NYHETER').length===1&&result.navigation.find(n=>n.label==='MENY')?.href==='#'+menu.anchor,JSON.stringify(result.navigation));});
document.querySelector('#results').textContent=outcomes.join('\n');document.body.dataset.testStatus=outcomes.some(o=>o.startsWith('FAIL'))?'fail':'pass';
</script></html>
