<!doctype html><html lang="sv"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plattform QA</title><style>body{font:14px/1.6 system-ui;margin:24px;color:#253243;background:#f5f6f8}button{min-height:44px;padding:10px 18px}iframe{display:block;margin-top:20px;border:1px solid #dbe1e8;height:900px}pre{white-space:pre-wrap}.tester{position:absolute;left:-5000px}</style><h1>Plattformens kundflöde</h1><p>Testar endast lokala QA-förslag på den här testadressen. Osparade befintliga utkast lämnas kvar.</p><button id="run" disabled>Testa översikt → design → delning</button><label>Bredd <select id="width"><option>375</option><option>320</option><option>820</option><option>1280</option></select></label><pre id="result" role="status">Redo.</pre><iframe id="sample" src="/" width="375" title="Verktyget på mobil"></iframe><script type="module">
const output=document.getElementById('result'),sample=document.getElementById('sample');
document.getElementById('width').onchange=event=>sample.width=event.target.value;
document.getElementById('run').onclick=async()=>{
 document.getElementById('run').disabled=true;
 let frame,checks=0;const errors=[];
 const wait=async(predicate,message)=>{const started=performance.now();while(!predicate()&&performance.now()-started<12000)await new Promise(resolve=>requestAnimationFrame(resolve));if(!predicate())throw Error(message);};
 const check=(ok,message)=>{checks++;if(!ok)errors.push(message);};
 const load=width=>new Promise((resolve,reject)=>{
  frame?.remove();frame=document.createElement('iframe');frame.className='tester';frame.width=width;frame.style.height=(width===1280?720:900)+'px';
  const timer=setTimeout(()=>reject(Error('Testvyn laddade inte inom 15 sekunder')),15000);frame.onload=()=>{clearTimeout(timer);resolve();};frame.src='/?workspace-qa='+Date.now();document.body.append(frame);
 });
 try{for(const width of [320,375,820,1280]){
  await load(width);const d=frame.contentDocument,w=frame.contentWindow,$=id=>d.getElementById(id);await wait(()=>$('workspaceStatus').hidden,'Studion öppnas inte');const visible=node=>w.getComputedStyle(node).display!=='none';
  check(!$('projectsView').hidden&&$('editorView').hidden,width+': översikt öppnas inte först');check(visible($('startWebsite'))&&visible($('startSocial')),width+': startval saknas');check(d.documentElement.scrollWidth<=width+1,width+': översikt har horisontell scroll');
  $('startWebsite').click();await wait(()=>!$('editorView').hidden||$('draftChangeDialog').open,'Hemsidestart svarar inte');if($('draftChangeDialog').open){$('draftChangeDialog').close();throw Error('Testmiljön innehåller ett osparat utkast. Det är bevarat. Spara det före QA.');}
  check($('editorView').dataset.step==='source'&&d.activeElement===$('sourceUrl'),width+': hemsidestart visar inte URL-fältet');check(!visible($('previewPanel'))&&!visible(d.querySelector('.editor-panel')),width+': tom sida visar hela editorn');
  $('importButton').click();check(d.activeElement===$('sourceUrl'),width+': tom URL saknar fokus');$('sourceContinue').click();check($('editorView').dataset.step==='design'&&visible(d.querySelector('.editor-panel')),width+': manuell start visar inte designsteget');
  const input=(id,value)=>{$(id).value=value;$(id).dispatchEvent(new w.Event('input',{bubbles:true}));};
  input('name','Studio QA '+width);input('headline','Ett tydligare första intryck.');input('description','Illustrativt lokalt test av hemsideförslaget.');$('addCard').click();input('card-title-0','Våra tjänster');input('card-description-0','Företagets egna ord och tjänster.');
  $('detailsTabButton').click();input('email','qa@example.com');check(!$('detailsTab').hidden&&$('contentTab').hidden,width+': kontaktfliken fungerar inte');$('contentTabButton').click();
  $('chooseTemplate').click();await wait(()=>$('templateDialog').open,'Designväljaren öppnas inte');check($('templateGroup').value==='recommended'&&d.querySelectorAll('[data-template-preview]').length<=4,width+': designväljaren börjar inte med ett kort urval');const thumbnail=d.querySelector('.template-thumbnail iframe');await wait(()=>thumbnail.hasAttribute('srcdoc'),'Designminiatyren laddas inte');check(thumbnail.srcdoc.includes('<body inert')&&!thumbnail.srcdoc.includes('<script '),width+': miniatyren är inte en stilla provsida');check(d.documentElement.scrollWidth<=width+1,width+': designväljaren ryms inte');$('templateGroup').value='all';$('templateGroup').dispatchEvent(new w.Event('change'));d.querySelector('[data-template-preview="precision"]').click();$('applyTemplate').click();await wait(()=>!$('templateDialog').open,'Designen kan inte väljas');check($('name').value==='Studio QA '+width&&$('headline').value==='Ett tydligare första intryck.',width+': designval ändrar texten');
  $('brandTabButton').click();$('headingFont').value='Georgia';$('headingFont').dispatchEvent(new w.Event('change'));$('bodyFont').value='Verdana';$('bodyFont').dispatchEvent(new w.Event('change'));
  await wait(()=>$('preview').contentDocument?.querySelector('h1')&&$('preview').contentWindow.getComputedStyle($('preview').contentDocument.querySelector('h1')).fontFamily.includes('Georgia'),'Valt rubriktypsnitt visas inte');
  check($('preview').contentWindow.getComputedStyle($('preview').contentDocument.body).fontFamily.includes('Verdana'),width+': valt brödtypsnitt visas inte');
  $('chooseTemplate').click();await wait(()=>$('templateDialog').open,'Typsnittsvalet kan inte provas');check($('templateFonts').checked,width+': designens typsnitt är inte synliga som ett explicit val');$('cancelTemplate').click();check($('headingFont').value==='Georgia',width+': avbryt designval ändrar typsnitt');
  $('chooseTemplate').click();await wait(()=>$('templateDialog').open,'Designen kan inte återöppnas');$('applyTemplate').click();await wait(()=>!$('templateDialog').open,'Designens typsnitt kan inte användas');check($('headingFont').value===''&&$('bodyFont').value==='',width+': designens typsnitt används inte efter bekräftat val');$('contentTabButton').click();
  if(width<=900){$('previewViewButton').click();check(visible($('previewPanel'))&&!visible($('editorInspector')),width+': mobil visar redigering och preview samtidigt');await new Promise(resolve=>w.requestAnimationFrame(resolve));check($('previewFrameWrap').getBoundingClientRect().right<=width+1,width+': mobilpreview ryms inte');$('focusPreview').click();check($('focusPreview').getAttribute('aria-pressed')==='true',width+': kan inte utöka preview');$('editorViewButton').click();check(visible($('editorInspector'))&&!visible($('previewPanel'))&&!d.querySelector('.workspace').classList.contains('preview-focus'),width+': kan inte återgå från utökad preview till redigering');}
  else{$('focusPreview').click();check($('focusPreview').getAttribute('aria-pressed')==='true',width+': kan inte utöka preview');check(!visible(d.querySelector('.workflow')),'1280: utökad preview visar fortfarande stegnavigation');const previewMenu=d.querySelector('.preview-tools');previewMenu.querySelector('summary').click();d.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',bubbles:true,cancelable:true}));check(!previewMenu.open&&$('focusPreview').getAttribute('aria-pressed')==='true','1280: första Escape ska bara stänga menyn');d.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));check($('focusPreview').getAttribute('aria-pressed')==='false'&&visible($('editorInspector')),width+': Escape återställer inte arbetsytan');}
  const settings=d.querySelector('.workspace-settings'),projectMenu=d.querySelector('.header-actions .project-menu'),designMenu=d.querySelector('.design-tools');
  settings.querySelector('summary').click();check(settings.open,width+': inställningar öppnas inte');projectMenu.querySelector('summary').click();check(projectMenu.open&&!settings.open,width+': två menyer ligger öppna samtidigt');
  designMenu.querySelector('summary').click();check(designMenu.open&&!projectMenu.open,width+': designmenyn stänger inte projektmenyn');$('name').click();check(!designMenu.open,width+': klick utanför stänger inte menyn');
  settings.querySelector('summary').click();d.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',bubbles:true,cancelable:true}));check(!settings.open&&d.activeElement===settings.querySelector('summary'),width+': Escape stänger inte inställningar och återställer fokus');
  if(width===1280){check($('previewStage').getBoundingClientRect().height>=330,'1280x720: för liten yta för kundsidan');check($('editorInspector').getBoundingClientRect().height>=420,'1280x720: för liten redigerare');}
  check(d.documentElement.scrollWidth<=width+1,width+': editorn har horisontell scroll');
  $('saveButton').click();await wait(()=>$('savedState').textContent==='SPARAT'&&!$('saveButton').disabled,'QA-utkastet sparas inte');w.scrollTo(0,d.body.scrollHeight);$('showProjects').click();check(w.scrollY===0&&d.activeElement===$('projectsTitle'),width+': översikten öppnas mitt i sidan');await wait(()=>[...d.querySelectorAll('.project-tile h2')].some(n=>n.textContent==='Studio QA '+width),'Sparat QA-förslag saknas');
  check(!$('projectsView').hidden,width+': biblioteket öppnas inte');input('projectSearch','ingen matchning 0983');check(!!d.querySelector('.projects-empty'),width+': sökning saknar empty state');input('projectSearch','');w.scrollTo(0,d.body.scrollHeight);$('dashboardResume').click();check(w.scrollY===0&&d.activeElement===$('projectTitle'),width+': redigeraren öppnas mitt i sidan');
  input('description','Ett osparat QA-utkast ska finnas kvar.');$('showProjects').click();$('startSocial').click();await wait(()=>$('draftChangeDialog').open,'Osparat utkast saknar skydd');$('draftChangeDialog').close();await new Promise(resolve=>w.requestAnimationFrame(resolve));check($('description').value==='Ett osparat QA-utkast ska finnas kvar.',width+': avbruten start förstör utkastet');$('dashboardResume').click();$('saveButton').click();await wait(()=>$('savedState').textContent==='SPARAT'&&!$('saveButton').disabled,'Skyddat utkast sparas inte');
  d.querySelector('[data-workflow-step="review"]').click();await wait(()=>$('reviewDialog').open,'Granskningen öppnas inte');await wait(()=>!$('confirmShare').disabled,'Granskningen kan inte slutföras');$('confirmShare').click();await wait(()=>$('shareDialog').open,'Delningsdialogen öppnas inte');check($('shareUrl').value.includes('/demo.html#d='),width+': kundlänk saknas');$('shareDialog').close();
  $('showProjects').click();$('startSocial').click();await wait(()=>$('socialDialog').open,'Socialt flöde öppnas inte');check(d.querySelector('#socialDialog h2').textContent==='Skapa från sociala medier.',width+': otydlig social start');
  check($('socialDialog').dataset.socialStep==='profile'&&$('socialCompanyPanel').hidden,width+': social start visar hela formuläret');$('socialNext').click();check(d.activeElement===$('socialLinks'),width+': saknad profil får inte fokus');input('socialLinks','https://instagram.com/studio.qa/');$('socialNext').click();check($('socialDialog').dataset.socialStep==='company',width+': manuell profilstart fungerar inte');
  input('socialName','Social QA '+width);input('socialBio','Företagets egna ord i ett lokalt test.');$('socialNext').click();check($('socialDialog').dataset.socialStep==='images'&&!$('socialCreate').hidden,width+': slutsteget visar inte skapa-knappen');check($('socialAddPhotos').tagName==='BUTTON',width+': bilduppladdning är inte en tangentbordskontroll');const canvas=d.createElement('canvas');canvas.width=canvas.height=24;const context=canvas.getContext('2d');context.fillStyle='#51677e';context.fillRect(0,0,24,24);const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png')),upload=new w.DataTransfer();upload.items.add(new w.File([blob],'qa.png',{type:'image/png'}));$('socialPhotoUpload').files=upload.files;$('socialPhotoUpload').dispatchEvent(new w.Event('change',{bubbles:true}));await wait(()=>d.querySelectorAll('#socialPhotos .social-photo').length===1&&!$('socialCreate').disabled,'QA-bilden kan inte läggas till');check($('socialDialog').scrollWidth<=$('socialDialog').clientWidth+1,width+': bildkort klipps i social dialog');$('socialBack').click();check($('socialBio').value==='Företagets egna ord i ett lokalt test.',width+': tillbaka raderar text');
  check($('socialDialog').scrollWidth<=$('socialDialog').clientWidth+1,width+': innehållet klipps i social dialog');check(d.documentElement.scrollWidth<=width+1,width+': social dialog ryms inte');$('socialDialog').close();await new Promise(resolve=>w.requestAnimationFrame(resolve));$('showProjects').click();$('startSocial').click();await wait(()=>$('socialDialog').open,'Social återöppning fungerar inte');$('socialResume').click();check($('socialName').value==='Social QA '+width,width+': avbrutet underlag går inte att återställa');$('socialDialog').close();
  output.textContent=checks+' kontroller passerar…';
 }}catch(error){errors.push(error.message);}finally{frame?.remove();}
 document.getElementById('run').disabled=false;document.title=errors.length?'FAIL workspace':'PASS workspace';output.textContent=errors.length?'FAIL\n'+errors.join('\n'):`PASS ${checks} kontroller · 320/375/820/1280 · översikt · hemsida/socialt/manuellt · designval · mobilvy · spara/återöppna · sökning · utkastskydd · kundlänk`;
};
document.getElementById('run').disabled=false;
</script></html>
