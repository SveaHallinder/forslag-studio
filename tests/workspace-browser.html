<!doctype html><html lang="sv"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plattform QA</title><style>body{font:14px/1.6 system-ui;margin:24px;color:#253243;background:#f5f6f8}button{min-height:44px;padding:10px 18px}iframe{display:block;margin-top:20px;border:1px solid #dbe1e8;height:900px}pre{white-space:pre-wrap}.tester{position:absolute;left:-5000px}</style><h1>Plattformens kundflöde</h1><p>Testar endast lokala QA-förslag på den här testadressen. Osparade befintliga utkast lämnas kvar.</p><button id="run" disabled>Testa översikt → design → delning</button><label>Bredd <select id="width"><option>375</option><option>320</option><option>820</option><option>1280</option></select></label><pre id="result" role="status">Redo.</pre><iframe id="sample" src="/" width="375" title="Verktyget på mobil"></iframe><script type="module">
const output=document.getElementById('result'),sample=document.getElementById('sample');
document.getElementById('width').onchange=event=>sample.width=event.target.value;
document.getElementById('run').onclick=async()=>{
 document.getElementById('run').disabled=true;
 const frame=document.createElement('iframe');frame.className='tester';frame.height=900;document.body.append(frame);let checks=0;const errors=[];
 const wait=async(predicate,message)=>{const started=performance.now();while(!predicate()&&performance.now()-started<12000)await new Promise(resolve=>requestAnimationFrame(resolve));if(!predicate())throw Error(message);};
 const check=(ok,message)=>{checks++;if(!ok)errors.push(message);};
 const load=()=>new Promise(resolve=>{frame.onload=resolve;frame.src='/?workspace-qa='+Date.now();});
 try{for(const width of [320,375,820,1280]){
  frame.width=width;await load();const d=frame.contentDocument,w=frame.contentWindow,$=id=>d.getElementById(id);await wait(()=>$('workspaceStatus').hidden,'Studion öppnas inte');const visible=node=>w.getComputedStyle(node).display!=='none';
  check(!$('projectsView').hidden&&$('editorView').hidden,width+': översikt öppnas inte först');check(visible($('startWebsite'))&&visible($('startSocial')),width+': startval saknas');check(d.documentElement.scrollWidth<=width+1,width+': översikt har horisontell scroll');
  $('startWebsite').click();await wait(()=>!$('editorView').hidden||$('draftChangeDialog').open,'Hemsidestart svarar inte');if($('draftChangeDialog').open){$('draftChangeDialog').close();throw Error('Testmiljön innehåller ett osparat utkast. Det är bevarat. Spara det före QA.');}
  check($('editorView').dataset.step==='source'&&d.activeElement===$('sourceUrl'),width+': hemsidestart visar inte URL-fältet');check(!visible($('previewPanel'))&&!visible(d.querySelector('.editor-panel')),width+': tom sida visar hela editorn');
  $('importButton').click();check(d.activeElement===$('sourceUrl'),width+': tom URL saknar fokus');$('sourceContinue').click();check($('editorView').dataset.step==='design'&&visible(d.querySelector('.editor-panel')),width+': manuell start visar inte designsteget');
  const input=(id,value)=>{$(id).value=value;$(id).dispatchEvent(new w.Event('input',{bubbles:true}));};
  input('name','Studio QA '+width);input('headline','Ett tydligare första intryck.');input('description','Illustrativt lokalt test av hemsideförslaget.');$('addCard').click();input('card-title-0','Våra tjänster');input('card-description-0','Företagets egna ord och tjänster.');
  $('detailsTabButton').click();input('email','qa@example.com');check(!$('detailsTab').hidden&&$('contentTab').hidden,width+': kontaktfliken fungerar inte');$('contentTabButton').click();
  $('chooseTemplate').click();await wait(()=>$('templateDialog').open,'Designväljaren öppnas inte');d.querySelector('[data-template-preview="precision"]').click();$('applyTemplate').click();await wait(()=>!$('templateDialog').open,'Designen kan inte väljas');check($('name').value==='Studio QA '+width&&$('headline').value==='Ett tydligare första intryck.',width+': designval ändrar texten');
  if(width<=900){$('previewViewButton').click();check(visible($('previewPanel'))&&!visible($('editorInspector')),width+': mobil visar redigering och preview samtidigt');await new Promise(resolve=>w.requestAnimationFrame(resolve));check($('previewFrameWrap').getBoundingClientRect().right<=width+1,width+': mobilpreview ryms inte');$('focusPreview').click();check($('focusPreview').getAttribute('aria-pressed')==='true',width+': kan inte utöka preview');$('editorViewButton').click();check(visible($('editorInspector'))&&!visible($('previewPanel'))&&!d.querySelector('.workspace').classList.contains('preview-focus'),width+': kan inte återgå från utökad preview till redigering');}
  else{$('focusPreview').click();check($('focusPreview').getAttribute('aria-pressed')==='true',width+': kan inte utöka preview');d.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));check($('focusPreview').getAttribute('aria-pressed')==='false'&&visible($('editorInspector')),width+': Escape återställer inte arbetsytan');}
  check(d.documentElement.scrollWidth<=width+1,width+': editorn har horisontell scroll');
  $('saveButton').click();await wait(()=>$('savedState').textContent==='SPARAT'&&!$('saveButton').disabled,'QA-utkastet sparas inte');$('showProjects').click();await wait(()=>[...d.querySelectorAll('.project-tile h2')].some(n=>n.textContent==='Studio QA '+width),'Sparat QA-förslag saknas');
  check(!$('projectsView').hidden,width+': biblioteket öppnas inte');input('projectSearch','ingen matchning 0983');check(!!d.querySelector('.projects-empty'),width+': sökning saknar empty state');input('projectSearch','');$('dashboardResume').click();
  input('description','Ett osparat QA-utkast ska finnas kvar.');$('showProjects').click();$('startSocial').click();await wait(()=>$('draftChangeDialog').open,'Osparat utkast saknar skydd');$('draftChangeDialog').close();await new Promise(resolve=>w.requestAnimationFrame(resolve));check($('description').value==='Ett osparat QA-utkast ska finnas kvar.',width+': avbruten start förstör utkastet');$('dashboardResume').click();$('saveButton').click();await wait(()=>$('savedState').textContent==='SPARAT'&&!$('saveButton').disabled,'Skyddat utkast sparas inte');
  d.querySelector('[data-workflow-step="review"]').click();await wait(()=>$('reviewDialog').open,'Granskningen öppnas inte');await wait(()=>!$('confirmShare').disabled,'Granskningen kan inte slutföras');$('confirmShare').click();await wait(()=>$('shareDialog').open,'Delningsdialogen öppnas inte');check($('shareUrl').value.includes('/demo.html#d='),width+': kundlänk saknas');$('shareDialog').close();
  $('showProjects').click();$('startSocial').click();await wait(()=>$('socialDialog').open,'Socialt flöde öppnas inte');check(d.querySelector('#socialDialog h2').textContent==='Skapa från sociala medier.',width+': otydlig social start');$('socialDialog').close();
  output.textContent=checks+' kontroller passerar…';
 }}catch(error){errors.push(error.message);}finally{frame.remove();}
 document.getElementById('run').disabled=false;document.title=errors.length?'FAIL workspace':'PASS workspace';output.textContent=errors.length?'FAIL\n'+errors.join('\n'):`PASS ${checks} kontroller · 320/375/820/1280 · översikt · hemsida/socialt/manuellt · designval · mobilvy · spara/återöppna · sökning · utkastskydd · kundlänk`;
};
document.getElementById('run').disabled=false;
</script></html>
